name: Audit de cohérence

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Zéro dépendance : Node 22 exécute le TypeScript nativement (type stripping).
      # Le run échoue si une des 486 combinaisons a une violation dure
      # (règles d'acceptation « audit 2 » : affûtage ≥40%, zéro VO2 en affûtage,
      # bornes brick, pic en phase peak, séances chiffrées, récup/adjacence).
      - run: npm run audit:v1
