name: Audit de cohérence

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Zéro dépendance : Node 22 exécute le TypeScript nativement (type stripping).
      # Chaque run échoue si une des 486 combinaisons a une violation dure
      # (règles « audit 2 » + manifeste note.md). v1 = produit Coach_Pro_V1.5.html ;
      # v2 = moteur de raisonnement Sprint 1 ; demo:repair = garanties de la boucle
      # de réparation (ciblée + meilleur-plan-avec-avertissements).
      - run: npm run audit:v1
      - run: npm run audit:v2
      - run: npm run demo:repair
      - run: npm run demo:readiness
      - run: npm run demo:fit
      - run: npm run demo:measured
      - run: npm run demo:nutrition
      - run: npm run demo:retention
      # Le bundle EBV2 committé dans le HTML doit correspondre aux sources src/
      - run: npm run check:app
      # Banc de régression externe (audit v6, 29/07/2026) : sort en 1 à la moindre
      # RÉGRESSION (test attendu vert qui échoue). La dette connue ne casse pas la CI —
      # c'est le but : elle documente l'écart sans bloquer le travail.
      - run: npm run audit:v6
      # Banc externe multi-sport (v7) : compare le plan émis aux PROMESSES, pas à l'auditeur
      # interne. Budget par check dans scripts/runAuditV7.mjs (0 = garde-fou définitif).
      - run: npm run audit:v7
      # R11 — contrat d'ENTRÉE : 551 entrées fausses doivent tomber en refus MOTIVÉ, en
      # « sans effet », ou en dérive ANNONCÉE. Zéro dérive silencieuse, zéro crash non typé.
      - run: npm run audit:amont
      # R11.8 — banc de SENSIBILITÉ : toute réponse du questionnaire doit modifier le plan.
      # Une clé inerte fait échouer la CI — c'est ce qui empêche `cycle_sync` et `dispo` de
      # redevenir des cases à cocher sans effet.
      - run: npm run audit:sensibilite
      # R12 — le chemin de l'athlète qui ne connaît AUCUNE de ses références (le cas majoritaire
      # d'une V1) : 0 séance sans repère exécutable, aucun adjectif auto-déclaré ne pilote un
      # chiffre, aucune référence sans chemin d'acquisition dans l'outil.
      - run: npm run audit:public
      # Golden master : 814 plans photographiés, détection d'écart au bit près. Les empreintes
      # sont versionnées ; tout changement de plan doit être VOULU et recapturé explicitement.
      - run: npm run golden:verify

  # E2E navigateur : les smokes de la PWA (check-in, R4, rétention, améliorations)
  # tournent dans un vrai Chromium — Playwright est une devDependency de TEST
  # uniquement, le produit et l'audit restent à zéro dépendance.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
