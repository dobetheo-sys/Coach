name: Audit de cohérence

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Zéro dépendance : Node 22 exécute le TypeScript nativement (type stripping).
      # Chaque run échoue si une des 486 combinaisons a une violation dure
      # (règles « audit 2 » + manifeste note.md). v1 = produit Coach_Pro_V1.5.html ;
      # v2 = moteur de raisonnement Sprint 1 ; demo:repair = garanties de la boucle
      # de réparation (ciblée + meilleur-plan-avec-avertissements).
      - run: npm run audit:v1
      - run: npm run audit:v2
      - run: npm run demo:repair
      - run: npm run demo:readiness
      - run: npm run demo:fit
      - run: npm run demo:measured
      - run: npm run demo:nutrition
      - run: npm run demo:retention
      # R21 — le coach proactif : les seuils mordent, le recalcul est borné à 14 jours,
      # et il ne remonte JAMAIS la charge. Cette dernière garantie est la raison d'être
      # du gate : un déclencheur automatique qui « rattrape » un volume manqué ferait
      # tout seul ce que la priorité n°2 du manifeste interdit.
      - run: npm run demo:proactif
      # R22 — préparation TRONQUÉE. Le gate vérifie les deux moitiés : sans le drapeau le
      # refus dur de R11.4 est intact mot pour mot, et avec le drapeau le plan livré est
      # identique aux dernières semaines de celui d'un athlète parti à l'heure (la
      # contrainte « on ne touche qu'à l'entrée et à la sortie » devient une propriété).
      - run: npm run demo:troncature
      # H-1 — la VFC devient une MESURE. Le gate porte surtout sur le §2 : `hrvStatus` pesait
      # −2 sur le registre OBJECTIF — celui que A4 a créé pour qu'un ressenti ne puisse pas
      # effacer une mesure — alors qu'il ÉTAIT un ressenti auto-déclaré. Une déclaration ne
      # doit plus jamais peser comme une valeur comparée à la base de l'athlète.
      - run: npm run demo:hrv
      - run: npm run demo:avatartri
      # Le bundle EBV2 committé dans le HTML doit correspondre aux sources src/
      - run: npm run check:app
      # O-24 — le service worker sert l'app en cache-first : tant que sa VERSION ne
      # change pas, un navigateur qui a déjà ouvert l'app NE VOIT AUCUN correctif.
      # Elle était incrémentée à la main, donc elle ne l'était pas : 12 commits et
      # 14 modules servis avaient passé sans qu'elle bouge. Elle est maintenant le
      # hachage du contenu, et ce gate refuse un sw.js désynchronisé.
      - run: npm run check:sw
      # Banc de régression externe (audit v6, 29/07/2026) : sort en 1 à la moindre
      # RÉGRESSION (test attendu vert qui échoue). La dette connue ne casse pas la CI —
      # c'est le but : elle documente l'écart sans bloquer le travail.
      - run: npm run audit:v6
      # Banc externe multi-sport (v7) : compare le plan émis aux PROMESSES, pas à l'auditeur
      # interne. Budget par check dans scripts/runAuditV7.mjs (0 = garde-fou définitif).
      - run: npm run audit:v7
      # R11 — contrat d'ENTRÉE : 551 entrées fausses doivent tomber en refus MOTIVÉ, en
      # « sans effet », ou en dérive ANNONCÉE. Zéro dérive silencieuse, zéro crash non typé.
      - run: npm run audit:amont
      # R13 — banc du handoff standalone-4 : 24 critères (âge/bornes, CSS print, nage tri
      # mono-séance, semaine de course, épaule, phases plafonnées) + non-régressions.
      # Le standalone n'existe pas en CI : les contrôles R13.2 passent en SKIP assumé.
      - run: npm run audit:r13
      # R14 — banc de la PRÉDICTION PROJETÉE (16 critères) : contrat `projected`, adhérence
      # en fenêtre glissante, gain plafonné et saturant, incertitude bornée, pacing JAMAIS
      # projeté (P6, la règle de sécurité du chapitre), et les deux non-régressions qui
      # verrouillent la prédiction « forme actuelle ».
      - run: npm run audit:r14
      # R14.1 — addendum correctif : le plafond de gain s'indexe sur la DISTANCE AU POTENTIEL
      # (références mesurées), plus sur l'ancienneté ; fourchette asymétrique ; vélo en deux
      # lignes ; levier poids sous gardes dures. Périme R14.4 et R14.6-A/B du banc R14.
      - run: npm run audit:r14.1
      # R15 — chapitres MOTEUR du handoff de revue du registre : relief vélo dans la cible
      # d'intensité (O-2), plancher et déverrouillage de la semaine de course, et éligibilité
      # âge × format (un mineur ne prépare pas douze mois une épreuve interdite à l'inscription).
      - run: npm run audit:r15
      # R18 — retour de TEST du fondateur sur l'application livrée. Deux défauts moteur, tous
      # deux plus larges que ce que le test avait vu : le brick disparaissait des trois
      # dernières semaines en tri et en duathlon (la transition est une compétence, elle se
      # perd), et la cadence de récupération ignorait les phases (75 % des plans déchargeaient
      # DANS le pic). Le banc porte aussi l'arbitrage qui les borne : aucune règle de placement
      # ne fait dépasser à l'athlète sa propre cadence de récupération.
      - run: npm run audit:r18
      # R11.8 — banc de SENSIBILITÉ : toute réponse du questionnaire doit modifier le plan.
      # Une clé inerte fait échouer la CI — c'est ce qui empêche `cycle_sync` et `dispo` de
      # redevenir des cases à cocher sans effet.
      - run: npm run audit:sensibilite
      # R12 — le chemin de l'athlète qui ne connaît AUCUNE de ses références (le cas majoritaire
      # d'une V1) : 0 séance sans repère exécutable, aucun adjectif auto-déclaré ne pilote un
      # chiffre, aucune référence sans chemin d'acquisition dans l'outil.
      - run: npm run audit:public
      # R20.6 — BANC D'INVARIANTS, désormais BLOQUANT (O-9). 20 propriétés que le plan tient
      # TOUJOURS, sur 54 configurations (6 sports × 3 enveloppes × 3 niveaux). Il sortait en
      # code 0 quoi qu'il trouve et n'était pas en CI : il a donc porté quatre familles
      # d'échecs pendant que la documentation le disait vert. Un rapport que rien ne lit
      # vaut zéro.
      - run: npm run audit:invariants
      # RV — le raisonnement inverse (chrono visé). Son critère central, `RV-INVARIANT`,
      # assertе que le plan émis est IDENTIQUE au bit près avec et sans objectif de temps :
      # c'est la garantie que la performance reste une SORTIE et jamais une entrée qui
      # construit (priorité n°5 du manifeste sous les quatre premières).
      - run: npm run demo:faisabilite
      # Golden master : 814 plans photographiés, détection d'écart au bit près. Les empreintes
      # sont versionnées ; tout changement de plan doit être VOULU et recapturé explicitement.
      - run: npm run golden:verify

  # E2E navigateur : les smokes de la PWA (check-in, R4, rétention, améliorations)
  # tournent dans un vrai Chromium — Playwright est une devDependency de TEST
  # uniquement, le produit et l'audit restent à zéro dépendance.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
