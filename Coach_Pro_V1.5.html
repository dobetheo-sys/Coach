.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px;position:relative;}

.trail{position:sticky;top:22px;background:var(--bg2);border:3px solid var(--ink);border-radius:var(--cut);box-shadow:var(--paper-shadow);padding:20px 18px;max-height:calc(100vh - 44px);overflow-y:auto;transform:rotate(-.5deg);}
.trail-toggle{display:none;}
@media(max-width:840px){
  .trail{position:fixed;inset:auto 12px 12px 12px;top:auto;max-height:55vh;overflow-y:auto;z-index:50;transform:translateY(calc(100% + 30px)) rotate(0);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);}
  .trail.open{transform:translateY(0) rotate(0);}
  .trail-toggle{display:flex;align-items:center;gap:8px;position:fixed;bottom:14px;right:14px;z-index:60;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:30px;padding:11px 18px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;letter-spacing:.02em;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg);}
  .trail-toggle:active{transform:rotate(-2deg) translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  .trail-toggle .cnt{background:var(--ink);color:var(--gold);border-radius:10px;padding:1px 8px;font-size:11px;}
}
.trail-h{font-family:'Archivo Black',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;display:inline-block;background:var(--ink);color:var(--bg2);padding:4px 10px;transform:rotate(-1.2deg);}
.trail-empty{font-family:'Caveat',cursive;font-size:17px;color:var(--text2);line-height:1.4;}
.trail-item{position:relative;padding:0 0 14px 18px;border-left:3px solid var(--ink);margin-left:5px;}
.trail-item:last-child{padding-bottom:2px;}
.trail-item::before{content:"";position:absolute;left:-8px;top:3px;width:12px;height:12px;border-radius:50% 40% 55% 45%;background:var(--bg2);border:3px solid var(--ink);}
.trail-q{font-family:'Space Grotesk',monospace;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.trail-a{font-size:13px;font-weight:700;margin-top:2px;}
.trail-rule{font-family:'Caveat',cursive;font-size:17px;color:var(--ink);margin-top:4px;line-height:1.25;background:linear-gradient(transparent 55%,rgba(232,162,0,.45) 55%,rgba(232,162,0,.45) 92%,transparent 92%);display:inline-block;padding:0 3px;}
.trail-rule strong{color:var(--ink) !important;font-weight:700;}
@keyframes ruleStamp{0%{transform:scale(1.25) rotate(-3deg);opacity:0;}60%{transform:scale(.97) rotate(.5deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
.trail-rule.new{animation:ruleStamp .45s cubic-bezier(.2,.9,.3,1.3);}
.trail::after{content:"";position:sticky;bottom:0;display:block;height:30px;margin-top:-30px;background:linear-gradient(transparent,var(--bg2));pointer-events:none;}

/* ===== HERO ===== */
.main{min-height:480px;position:relative;}
.hero{padding:6px 0 20px;position:relative;}
.hero h1{font-family:'Archivo Black',sans-serif;font-size:clamp(40px,6.5vw,62px);line-height:.92;letter-spacing:-.01em;text-transform:uppercase;}
.hero h1 em{font-style:normal;color:var(--bg2);background:var(--acc);padding:0 10px 2px;display:inline-block;transform:rotate(-1.6deg);box-shadow:4px 4px 0 var(--ink);transition:background .4s;}
.hero p{color:var(--text2);font-size:14px;margin-top:14px;max-width:540px;line-height:1.6;font-weight:500;}
.tier-badge{display:inline-flex;align-items:center;gap:7px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:6px 14px;margin-top:16px;border:3px solid var(--ink);transform:rotate(1deg);box-shadow:3px 3px 0 var(--ink);}
.tier-badge.free{background:#bfe8c8;color:var(--ink);}
.tier-badge.premium{background:var(--gold);color:var(--ink);}

/* ===== PROGRESSION : tickets déchirés ===== */
.progress{display:flex;gap:5px;margin:18px 0 26px;align-items:center;}
.pstep{height:14px;flex:1;background:var(--bg3);border:2.5px solid var(--ink);border-radius:3px 7px 4px 6px;transition:background .25s;}
.pstep.done{background:var(--acc);}
.pstep.cur{background:var(--gold);animation:curBlink 1.2s ease infinite alternate;}
@keyframes curBlink{from{transform:scaleY(1);}to{transform:scaleY(1.25);}}
.pstep.prem{background:repeating-linear-gradient(45deg,var(--bg3) 0 4px,#f1e3bd 4px 8px);}
.pstep.prem.done,.pstep.prem.cur{background:var(--gold);}
.psep{width:24px;flex:none;text-align:center;font-size:14px;transform:rotate(-8deg);}

/* ===== CARTE PRINCIPALE : feuille découpée ===== */
.card{background:var(--bg3);border:3px solid var(--ink);border-radius:var(--cut);box-shadow:var(--paper-shadow);padding:30px 30px 26px;animation:dropIn .4s cubic-bezier(.2,.9,.3,1.15);position:relative;}
@keyframes dropIn{from{opacity:0;transform:translateY(16px) rotate(.6deg);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){.card,.trail-rule.new,.pstep.cur{animation:none;}}
.card .eyebrow{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bg2);background:var(--ink);display:inline-block;padding:4px 10px;transform:rotate(-1deg);margin-bottom:12px;}
.card h2{font-family:'Archivo Black',sans-serif;font-size:clamp(22px,3.4vw,30px);line-height:1.02;text-transform:uppercase;margin-bottom:10px;}
.card .why{font-family:'Caveat',cursive;font-size:19px;color:var(--text2);line-height:1.3;margin-bottom:22px;border-left:4px solid var(--gold);padding-left:13px;transform:rotate(-.3deg);}

.q{margin-bottom:26px;}
.q-label{font-size:15px;font-weight:700;margin-bottom:11px;display:block;}
.q-sub{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:11px;line-height:1.55;font-weight:500;}
.q-def{font-family:'Caveat',cursive;font-size:17px;color:var(--ink);background:#dcecff;border:2.5px solid var(--ink);border-radius:14px 4px 16px 5px;padding:8px 13px;margin:-4px 0 12px;line-height:1.25;transform:rotate(-.4deg);box-shadow:3px 3px 0 var(--ink);}
.q-def::before{content:"💡 ";}

/* options : étiquettes découpées */
.opts{display:flex;flex-wrap:wrap;gap:10px;}
.opt{background:var(--bg3);border:2.5px solid var(--ink);border-radius:5px 12px 6px 11px;padding:10px 16px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .15s;user-select:none;}
.opts .opt:nth-child(odd){transform:rotate(-.7deg);}
.opts .opt:nth-child(even){transform:rotate(.6deg);}
.opt:hover{transform:translate(-2px,-2px) rotate(0);box-shadow:5px 5px 0 var(--ink);}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.opt.sel{background:var(--acc);color:#fff;transform:rotate(-1.3deg) scale(1.03);box-shadow:4px 4px 0 var(--ink);}
.opt.sel:hover{transform:rotate(-1.3deg) scale(1.03);}
.opt:focus-visible{outline:3px dashed var(--acc);outline-offset:3px;}
input[type=text],input[type=number],input[type=date]{background:var(--bg3);border:2.5px solid var(--ink);border-radius:4px 10px 5px 9px;padding:10px 14px;font-size:15px;font-weight:600;color:var(--ink);width:200px;font-family:'Space Grotesk',sans-serif;box-shadow:3px 3px 0 var(--ink);}
input:focus{outline:3px dashed var(--acc);outline-offset:3px;background:#fffbe8;}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;}
.row .q{margin-bottom:0;flex:1;min-width:150px;}

/* branche débloquée : post-it */
.branch{background:#fff4c2;border:2.5px solid var(--ink);border-radius:3px 14px 4px 12px;padding:16px 18px;margin-top:18px;transform:rotate(.5deg);box-shadow:4px 4px 0 var(--ink);animation:dropIn .3s ease;}
.branch .branch-tag{font-family:'Caveat',cursive;font-size:17px;color:var(--ink);margin-bottom:8px;font-weight:700;}

.nav{display:flex;justify-content:space-between;margin-top:28px;gap:10px;}
.btn{font-family:'Archivo Black',sans-serif;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:13px 26px;border:3px solid var(--ink);border-radius:6px 14px 7px 13px;background:var(--bg3);color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink);}
.btn.primary{background:var(--acc);color:#fff;}
.btn.primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink);}
.btn.gold{background:var(--gold);color:var(--ink);}
.btn:focus-visible{outline:3px dashed var(--acc);outline-offset:3px;}

/* ===== BLUEPRINT ===== */
.bp-heros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px;}
.bp-hero{background:var(--bg2);border:3px solid var(--ink);border-radius:4px 16px 5px 14px;padding:16px 15px;box-shadow:5px 5px 0 var(--ink);}
.bp-heros .bp-hero:nth-child(1){transform:rotate(-1.2deg);background:#ffe3e0;}
.bp-heros .bp-hero:nth-child(2){transform:rotate(.8deg);background:#fff4c2;}
.bp-heros .bp-hero:nth-child(3){transform:rotate(-.6deg);background:#dcecff;}
.bp-heros .bp-hero:nth-child(4){transform:rotate(1deg);background:#d9f3e1;}
.bp-hero .bh-cat{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:9px;color:var(--text2);letter-spacing:.1em;text-transform:uppercase;}
.bp-hero .bh-val{font-family:'Archivo Black',sans-serif;font-size:18px;line-height:1.08;margin-top:7px;text-transform:uppercase;}
.bp-cat{margin-bottom:8px;}
.bp-cat-h{display:flex;align-items:center;gap:9px;font-family:'Archivo Black',sans-serif;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:16px 0 8px;border-bottom:3px solid var(--ink);margin-bottom:4px;}
.bp-cat-h .ic{width:26px;height:26px;border:2.5px solid var(--ink);border-radius:40% 55% 45% 50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--gold);transform:rotate(-4deg);}
.bp-decision{display:grid;grid-template-columns:175px 1fr;gap:12px;padding:12px 0;border-bottom:2px dashed rgba(22,19,14,.25);font-size:13px;}
.bp-decision:last-child{border-bottom:none;}
.bp-what{font-weight:700;}
.bp-why{color:var(--text2);font-size:12px;line-height:1.55;font-weight:500;}
.bp-val{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;background:linear-gradient(transparent 55%,rgba(232,162,0,.4) 55%,rgba(232,162,0,.4) 92%,transparent 92%);display:inline;}
.warn{background:#ffe3e0;border:3px solid var(--ink);border-radius:4px 12px 5px 11px;padding:14px 16px;font-size:12.5px;color:var(--ink);line-height:1.6;margin-top:18px;font-weight:500;box-shadow:4px 4px 0 var(--ink);transform:rotate(-.3deg);}
.warn strong{color:var(--text);}
.locked{background:var(--bg2);border:3px dashed var(--ink);border-radius:var(--cut);padding:18px;margin-top:16px;}
.locked-h{font-family:'Archivo Black',sans-serif;font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px;}
.locked-item{font-size:12.5px;color:var(--text2);padding:4px 0;font-weight:500;}
.locked-item::before{content:"🔒 ";}
.gate{background:var(--gold);border:3px solid var(--ink);border-radius:var(--cut);padding:24px;margin-top:22px;text-align:center;box-shadow:var(--paper-shadow);transform:rotate(.4deg);}
.gate h3{font-family:'Archivo Black',sans-serif;font-size:21px;text-transform:uppercase;margin-bottom:8px;}
.gate p{font-size:13px;color:var(--ink);line-height:1.55;max-width:430px;margin:0 auto 16px;font-weight:600;}
@media(max-width:600px){.bp-decision{grid-template-columns:1fr;gap:3px;}}

/* ===== WELCOME ===== */
.welcome{text-align:center;padding:46px 28px;}
.welcome .w-tri{font-size:58px;line-height:1;margin-bottom:16px;display:inline-block;transform:rotate(-6deg);animation:triWiggle 3s ease-in-out infinite;}
@keyframes triWiggle{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(4deg) translateY(-4px);}}
@media(prefers-reduced-motion:reduce){.welcome .w-tri{animation:none;}}
.welcome h2{font-family:'Archivo Black',sans-serif;font-size:clamp(24px,4vw,34px);line-height:1.05;text-transform:uppercase;margin-bottom:14px;}
.welcome p{color:var(--text2);font-size:14px;line-height:1.65;max-width:480px;margin:0 auto 8px;font-weight:500;}
.welcome .w-meta{display:flex;gap:14px;justify-content:center;margin:26px 0;flex-wrap:wrap;}
.w-chip{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;border:2.5px solid var(--ink);padding:7px 13px;border-radius:4px 11px 5px 10px;background:var(--bg2);box-shadow:3px 3px 0 var(--ink);}
.w-chip:nth-child(1){transform:rotate(-1.5deg);}
.w-chip:nth-child(2){transform:rotate(1deg);background:#fff4c2;}
.w-chip:nth-child(3){transform:rotate(-.8deg);background:#ffe3e0;}
.w-chip b{color:var(--ink);}
.welcome .btn{margin-top:10px;font-size:14px;padding:16px 40px;}

/* ===== PLAN GÉNÉRÉ ===== */
.ph-line{display:flex;gap:5px;margin:10px 0 18px;}
.ph-seg{padding:10px 8px 8px;text-align:center;min-width:0;border:2.5px solid var(--ink);border-radius:4px 9px 5px 8px;box-shadow:3px 3px 0 var(--ink);}
.ph-seg span{display:block;font-family:'Archivo Black',sans-serif;font-size:11px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ph-seg em{font-family:'Space Grotesk',sans-serif;font-style:normal;font-weight:700;font-size:9px;color:var(--text2);}
.vol-bars{display:flex;align-items:flex-end;gap:2px;height:58px;margin-top:8px;padding:0 2px;border-bottom:3px solid var(--ink);}
.vb{flex:1;border:1.5px solid var(--ink);border-bottom:none;border-radius:3px 3px 0 0;min-width:3px;}
.vol-cap{font-family:'Caveat',cursive;font-size:16px;color:var(--text2);margin:7px 0 20px;}
.gw{background:var(--bg2);border:3px solid var(--ink);border-radius:5px 14px 6px 13px;padding:14px;margin-bottom:14px;box-shadow:5px 5px 0 var(--ink);}
.gw-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;}
.gw-h b{font-family:'Archivo Black',sans-serif;font-size:15px;text-transform:uppercase;}
.gw-h span{font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.06em;}
.gw-h em{font-family:'Space Grotesk',sans-serif;font-style:normal;font-weight:700;font-size:11px;color:var(--text2);margin-left:auto;}
.gw-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.gd{background:var(--bg3);border:2.5px solid var(--ink);border-radius:3px 8px 4px 7px;padding:7px 6px;min-height:88px;position:relative;box-shadow:2.5px 2.5px 0 var(--ink);}
.gd.dur{background:#ffe3e0;}
.gd.facile{background:#d9f3e1;}
.gd.recup{background:#e9defc;}
.gd.off{background:var(--bg2);opacity:.75;}
.gd-top{display:flex;justify-content:space-between;align-items:baseline;}
.gd-top b{font-size:10px;font-weight:800;}
.gd-top i{font-family:'Space Grotesk',sans-serif;font-style:normal;font-weight:700;font-size:7.5px;color:var(--text2);}
.gd-badges{font-size:12px;margin:3px 0 2px;}
.gd-n{font-size:8.5px;color:var(--text2);line-height:1.4;font-weight:600;}
.wk-skip{text-align:center;font-family:'Caveat',cursive;font-size:18px;color:var(--muted);padding:8px 0 14px;}
@media(max-width:680px){.gw-grid{grid-template-columns:repeat(2,1fr);}.gd{min-height:auto;}}

/* ===== DA DYNAMIQUE PAR INTENTION ===== */
body{transition:background .5s ease;}
body[data-intent="competition"]{--acc:#ff3b30;background:#f3e9dd;}
body[data-intent="finir"]{--acc:#ff7a1a;background:#f4ecdc;}
body[data-intent="finir"] .pstep.done{background:#ff7a1a;}
body[data-intent="plaisir"]{--acc:#2e6bff;background:#e9eee2;}
body[data-intent="plaisir"] .pstep.done{background:#2e6bff;}


/* ===== DÉTAIL SÉANCE ===== */
.gd-det{display:block;font-weight:500;font-size:11px;color:var(--text2);margin:2px 0 5px;line-height:1.4;}
.doneBtn{border:2px solid var(--ink);background:#fff;border-radius:8px;font-size:11px;font-weight:800;line-height:1;padding:1px 5px;cursor:pointer;color:var(--muted);vertical-align:middle;}
.doneBtn.done{background:#00a376;color:#fff;border-color:#00734f;}
.load-card{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:12px 12px 10px;margin:6px 0 20px;box-shadow:4px 4px 0 var(--ink);}
.load-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;margin-bottom:2px;}
.load-leg{font-size:11px;font-weight:700;text-align:center;margin:2px 0 4px;}
.load-sub{font-size:12px;color:var(--text2);line-height:1.5;}
.gd{min-height:96px;}

/* ===== IMPRESSION / EXPORT PDF ===== */
@media print{
  body{background:#fff !important;}
  body::before{display:none;}
  .trail,.trail-toggle,.progress,.nav,.tier-badge,.hero p{display:none !important;}
  .wrap{display:block;max-width:100%;padding:0;}
  .hero h1{font-size:26px;}
  .hero h1 em{box-shadow:none;}
  .card{box-shadow:none;border:2px solid #000;border-radius:8px;padding:16px;animation:none;}

  .ph-seg,.vb{print-color-adjust:exact;-webkit-print-color-adjust:exact;box-shadow:none;}
  .warn,.gate{box-shadow:none;}
}


/* ===== CHOIX DU SPORT ===== */
.sport-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px;}
@media(max-width:520px){.sport-grid{grid-template-columns:1fr;}}
.sport-card{background:var(--bg3);border:3px solid var(--ink);border-radius:5px 16px 6px 14px;padding:22px 18px;cursor:pointer;box-shadow:5px 5px 0 var(--ink);transition:transform .12s,box-shadow .12s;text-align:left;display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--sa);}
.sport-card:nth-child(odd){transform:rotate(-.8deg);}
.sport-card:nth-child(even){transform:rotate(.7deg);}
.sport-card:hover{transform:translate(-3px,-3px) rotate(0);box-shadow:8px 8px 0 var(--ink);}
.sport-card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
.sc-ico{font-size:38px;line-height:1;}
.sc-nom{font-family:'Archivo Black',sans-serif;font-size:20px;text-transform:uppercase;}
.sc-pitch{font-size:12px;color:var(--text2);font-weight:500;line-height:1.4;}
/* DA par sport */
body[data-sport="run"]{--acc:#ff7a1a;}
body[data-sport="bike"]{--acc:#2e6bff;}
body[data-sport="swim"]{--acc:#00b8d9;}
body[data-sport="tri"]{--acc:#ff3b30;}


/* ===== BANDEAU "CE QUI PILOTE TON PLAN" ===== */
.drv-band{margin:4px 0 22px;padding:16px;background:var(--bg2);border:3px solid var(--ink);border-radius:5px 16px 6px 14px;box-shadow:4px 4px 0 var(--ink);}
.drv-title{font-family:'Archivo Black',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:11px;color:var(--ink);}
.drv-wrap{display:flex;flex-wrap:wrap;gap:8px;}
.drv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-left:6px solid var(--dc,#888);border-radius:4px 10px 5px 9px;padding:6px 11px;box-shadow:2px 2px 0 var(--ink);}
.drv b{font-weight:400;font-size:14px;}
@media(max-width:600px){.drv{font-size:11px;padding:5px 9px;}}

<body>
<div class="wrap">
  <main class="main">
    <div class="hero">
      <h1>ENDURA<em>BUILD</em></h1>
      <p>Chaque réponse oriente les questions suivantes et déclenche des règles de construction. À la fin : le squelette de ton plan, avec la justification de chaque choix.</p>
      <span class="tier-badge free" id="tierBadge">● Profilage gratuit</span>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ============================================================
   CONFIG MULTISPORT — pilote les spécificités par discipline
   Le tronc commun (intention, santé, dispo, cycles, polarisation)
   reste partagé ; chaque sport surcharge ce qui lui est propre.
   ============================================================ */
const SPORTS = {
  tri: {
    nom:"Triathlon", ico:"🔺", accent:"#ff3b30",

/* ---------- HELPERS ZONES ---------- */
function bikeZones(ftp,hz){
  const W=(a,b)=>ftp?Math.round(ftp*a)+"-"+Math.round(ftp*b)+"W":null;
  const H=hz||{};
  return {z2:W(.56,.75)||H.z2||"effort 4/10 conversation", ss:W(.88,.94)||H.tempo||"effort 7/10 soutenu",
    vo2:W(1.06,1.18)||"effort 9/10 (RPE — la FC suit mal sur 4min)", frc:W(.78,.86)||"gros braquet, effort musculaire (cadence>FC)",
    rp:W(.68,.78)||H.z2||"allure course contrôlée", thr:W(.95,1.05)||H.seuil||"seuil ~1h"};
}
function runZones(pace,hz){
  let thr=0; if(pace&&/^\d+[:h.]\d+$/.test(pace.trim())){const m=pace.trim().split(/[:h.]/);thr=parseInt(m[0])*60+parseInt(m[1]);}
  const P=(a,b)=>{if(!thr)return null;const f=s=>Math.floor(s/60)+"'"+String(Math.round(s%60)).padStart(2,"0");return f(thr*a)+"-"+f(thr*b)+"/km";};
  const H=hz||{};
  return {easy:P(1.16,1.26)||H.z2||"allure conversation", mara:P(1.08,1.13)||H.tempo||"allure marathon",
    thr:P(1.0,1.05)||H.seuil||"allure seuil ~1h", vo2:P(.92,.97)||"allure 5-10min (RPE — FC peu fiable sur l'intervalle court)", rec:P(1.28,1.4)||H.z1||"récup très lent", thrRaw:thr};
}
function hrZones(age,hrMax,hrRest){
  const fcMax=parseInt(hrMax)||Math.round(208-0.7*(parseInt(age)||35));
  const rest=parseInt(hrRest)||0;
  // Karvonen si FC repos connue, sinon % FC max
  const Z=(lo,hi)=>{
    if(rest){const a=Math.round(rest+(fcMax-rest)*lo),b=Math.round(rest+(fcMax-rest)*hi);return a+"-"+b+" bpm";}
    return Math.round(fcMax*lo)+"-"+Math.round(fcMax*hi)+" bpm";
  };
  return {fcMax, z1:Z(.60,.70), z2:Z(.70,.80), tempo:Z(.80,.87), seuil:Z(.87,.92), vo2:Z(.92,.97)};
}
function swimZones(css){ // css = sec/100m
  let c=0; if(css&&/^\d+[:h.]\d+$/.test(css.trim())){const m=css.trim().split(/[:h.]/);c=parseInt(m[0])*60+parseInt(m[1]);}
  const P=(a)=>{if(!c)return null;const s=c*a;return Math.floor(s/60)+"'"+String(Math.round(s%60)).padStart(2,"0")+"/100m";};
  return {easy:P(1.12)||"souple, technique", aero:P(1.06)||"endurance régulière", css:P(1.0)||"allure seuil (test 400m)", speed:P(.94)||"rapide mais contrôlé", cssRaw:c};
}

/* ============================================================
   MOTEUR DE RÈGLES — commun + spécifique par sport
   ============================================================ */
function evalRules(a, tier){
  const R=[]; const add=(id,what,val,why)=>R.push({id,what,val,why});
  const sp=S.sport, cfg=SPORTS[sp]; if(!sp)return R;

  // ---- COMMUN : intention ----
  if(a.intent==="competition") add("intent","Philosophie","Performance — chrono cible","Intensité structurée, objectifs chiffrés, affûtage soigné, marges resserrées assumées.");
  else if(a.intent==="finir") add("intent","Philosophie","Finisher — arriver en forme","Volume minimal viable, marges de sécurité partout, pacing ultra-conservateur.");
  else if(a.intent==="plaisir") add("intent","Philosophie","Plaisir durable","Charge soutenable, variété, zéro culpabilisation. Le plan sert la vie.");

  // ---- COMMUN : santé maîtresse ----
  if(a.intent==="competition") add("sante","Priorité santé","Marges resserrées — assumées","Tu acceptes une marge de risque maîtrisée. Garde-fous actifs, seuils plus agressifs.");
  else if(a.intent) add("sante","Priorité santé","Règle maîtresse — zéro blessure","Chaque arbitrage penche vers la prudence. Marge de sécurité 10% sur tous les plafonds.");

  // ---- COMMUN : durée ----
  const fmt=a.format;
  if(fmt&&cfg.minWeeks[fmt]) add("duree","Durée de préparation",cfg.minWeeks[fmt]+" semaines minimum","Préparation proportionnée à l'objectif "+sp+".");

  // ---- COMMUN : sécurité médicale ----
  if(a.med_pain==="oui"||a.med_dizzy==="oui"||a.med_treat==="oui") add("medical","⚠️ Sécurité médicale","Avis médical REQUIS","Signal d'alerte déclaré. Aucune intensité générée sans feu vert d'un médecin. Gratuit, par principe.");

  // ---- SPÉCIFIQUE PAR SPORT : terrain / milieu ----
  if(sp==="run"){
    if(a.terrain==="trail") add("terrain","Terrain","Trail — dénivelé & technique","Travail de côte (montée/descente), renforcement excentrique quadri pour les descentes, gestion de l'allure au D+ et non au plat.");
    else if(a.terrain==="route") add("terrain","Terrain","Route — allure constante","Régularité d'allure, économie de course, travail de seuil et d'allure spécifique objectif.");
    else if(a.terrain==="piste") add("terrain","Terrain","Piste/mixte — vitesse","Travail de VMA et de vitesse pure, fractionné court de qualité.");
  }
  if(sp==="bike"){
    if(a.terrain==="montagne") add("terrain","Parcours","Montagneux — le W/kg est roi","Force en côte systématique, poids stratégique, pacing montée discipliné, descentes techniques.");
    else if(a.terrain==="vallonne") add("terrain","Parcours","Vallonné — relances","Travail de force, pacing à puissance variable, gestion des bosses au compteur.");
    else if(a.terrain==="plat") add("terrain","Parcours","Plat — puissance constante","Position aéro tenue, puissance régulière, travail au seuil et sweetspot.");
    if(a.format==="clm") add("clm","Spécificité CLM","Position & puissance seuil","Le contre-la-montre se gagne en position aéro à puissance constante : travail spécifique de tenue de position et de gestion d'effort au seuil.");
  }
  if(sp==="swim"){
    if(a.milieu==="ow"||a.milieu==="mixte") add("ow","Eau libre","Compétences spécifiques","Navigation aux repères, nage en peloton, sighting, départ groupé — à travailler en plus de la condition pure.");
    if(a.milieu==="bassin") add("bassin","Bassin","Technique & virages","Travail technique fin, virages, coulées, gestion de l'allure au pace-clock.");
  }

  // ---- COMMUN : niveau / historique ----
  if(a.level==="debutant"&&sp==="swim") add("tech","Priorité technique","Fréquence > volume","Débutant natation : la technique s'automatise par la fréquence. Séances courtes nombreuses, un focus technique par séance.");
  if(a.history==="reprise") add("recup","Rythme récup","2 charge + 1 récup (début), 3+1 ensuite","Corps en reconstruction : décharges plus fréquentes au début.");
  else if(a.history) add("recup","Rythme récup","3 charge + 1 récup","Standard pour un organisme habitué.");

  // ---- COMMUN : blessures ----
  const inj=(a.injury||"").split(",").filter(x=>x&&x!=="aucune");
  if(inj.length>=2) add("inj","Blessures multiples","Approche ultra-conservatrice","Plusieurs zones fragiles : progression ralentie, bilan médical avant montée en charge.");
  else if(inj.length===1){
    if(sp==="run") add("inj","Blessure","Volume progressif + renfo central","L'impact étant le risque n°1 en course, le volume monte lentement et le renforcement devient prioritaire.");
    else add("inj","Blessure","Charge adaptée à la zone fragile","Intensité maintenue sur ce qui est sain, progression prudente sur la zone touchée.");
  }

  // ---- COMMUN : volume (3 plafonds) ----
  if(a.sessions_max&&a.vol_max&&a.history){
    const caps={run:{reprise:{"5k":4,"10k":5,semi:6,marathon:8,trail:9},confirme:{"5k":5,"10k":6,semi:8,marathon:10,trail:12},ancien:{"5k":6,"10k":7,semi:9,marathon:12,trail:14}},
      bike:{reprise:{crit:6,route:8,cyclo:9,clm:7,gravel:11},confirme:{crit:8,route:11,cyclo:13,clm:10,gravel:15},ancien:{crit:10,route:14,cyclo:16,clm:12,gravel:20}},
      swim:{reprise:{sprint:3,demifond:4,fond:5,ow:6},confirme:{sprint:5,demifond:6,fond:7,ow:9},ancien:{sprint:6,demifond:8,fond:10,ow:12}},
      tri:{reprise:{S:6,M:8,"70.3":11,Full:15},confirme:{S:7,M:10,"70.3":13,Full:17},ancien:{S:8,M:12,"70.3":15,Full:19}}}[sp][a.history][fmt]||10;
    const util={run:{"5k":6,"10k":7,semi:9,marathon:12,trail:14},bike:{crit:9,route:13,cyclo:15,clm:11,gravel:20},swim:{sprint:6,demifond:8,fond:10,ow:12},tri:{S:8,M:11,"70.3":14,Full:18}}[sp][fmt]||12;
    const decl=parseInt(a.vol_max), marg=(a.intent==="competition")?1.0:0.9;
    const raw=Math.min(decl,caps,util), fin=Math.round(raw*marg*10)/10;
    let lim = raw===decl?"ta disponibilité":(raw===util?"l'utilité du format":"ton plafond physiologique");
    add("volume","Volume en pic",fin+(sp==="swim"?"h (eau)":"h")+" max",
      "Min de 3 plafonds — déclaré "+decl+"h, physio "+caps+"h, utile "+util+"h. Ici "+lim+" limite."+(marg<1?" Marge santé -10%.":"")+" Pic tenu quelques semaines seulement.");
    add("sessions","Séances/sem","jusqu'à "+a.sessions_max,"Réparties par le moteur selon tes priorités, pas en blocs égaux.");
  }

  // ---- COMMUN : structure cycle ----
  const nOff=(a.off_which||"").split(",").filter(Boolean).length;
  if(a.off_days==="oui"&&nOff>=2) add("cycle","Structure","Semaine 7 jours (jours bloqués)","Avec "+nOff+" jours bloqués, un cycle glissant placerait des séances clés sur tes indispos. La semaine fixe prime.");
  else if(a.dispo==="quotidienne"&&a.shift_ok==="oui") add("cycle","Structure","Cycles de 10 jours","Dispo quotidienne + décalage accepté : espacement optimal des séances clés, alternance parfaite.");
  else if(a.dispo) add("cycle","Structure","Semaine de 7 jours","Repères fixes : la meilleure périodisation est celle qu'on tient.");

  // ---- COMMUN : polarisation + renfo selon sport ----
  add("polar","Distribution","Polarisation ~80/20","Facile vraiment facile, dur vraiment dur. La zone grise fatigue sans progrès.");
  if(tier==="free") return R;

  // ---- PREMIUM commun ----
  if(a.sleep==="court") add("sleep","Sommeil","Plafond réduit ~15%","Moins de 6h30 : la récup limite, pas le temps. Volume ajusté + priorité sommeil.");
  if(a.life_load==="lourde") add("life","Charge de vie","Marge renforcée","Stress total élevé : récup plus fréquente, adaptation quotidienne assouplie.");
  if(a.hrv==="oui") add("hrv","Garde-fou HRV","Ajustement au jour le jour","N'affecte pas le plan généré : règle d'auto-ajustement quotidien à appliquer toi-même (HRV basse 2 matins → passe ta séance dure en facile ce jour-là). Filet anti-surentraînement.");

  // ---- PREMIUM : renfo/gammes par sport ----
  if(sp==="run"){
    add("renfo","Renforcement","2×/sem, pliométrie progressive","Course = impact. Renfo excentrique + gainage 2×/sem, pliométrie introduite progressivement (initiation→bipodale→unipodale→réactive) pour blinder les tissus. Recul d'un palier à toute douleur.");
    add("gammes","Gammes athlétiques","Dès le développement","Montées de genoux, talons-fesses, foulées bondissantes en échauffement : économie de course et prévention.");
  } else if(sp==="bike"){
    add("renfo","Renforcement","Gainage + force, 1-2×/sem","Gainage pour tenir la position, force max en salle (transfert puissance). Pas d'enjeu d'impact, mais le tronc lâche avant les jambes sur longue distance.");
    add("force","Force vélo","Basse cadence + force max","Gros braquet 50-60rpm + force salle coordonnées : développe la puissance sans usure articulaire.");
  } else if(sp==="swim"){
    add("renfo","Renforcement","Épaules + gainage","Coiffe des rotateurs (prévention épaule du nageur) + gainage (gréement du corps dans l'eau). Élastique 2-3×/sem.");
    add("tech_drill","Éducatifs","À chaque séance","La technique prime : éducatifs (rattrapé, poings fermés, battements) systématiques en échauffement.");
  } else if(sp==="tri"){
    add("renfo","Renforcement","Transversal 3 sports","Renfo tibial (course), gainage position (vélo), coiffe (nage). Pliométrie progressive si pas de blessure active.");
  }

  if(a.weight_lever==="oui"&&a.weight) add("poids","Levier poids","Signalé — pas encore dans les séances","Paramètre de performance"+(sp==="bike"||sp==="run"?" (W/kg ou portage)":"")+", jamais une injonction. Aucun contenu nutritionnel n'est encore généré dans le plan : à travailler avec un professionnel.");
  if(a.sex==="F"){ add("fer","Ferritine","Bilan 3×/an","Risque de carence en fer élevé en endurance féminine."); if(a.cycle_sync==="oui") add("cyclep","Périodisation menstruelle","Bientôt","Pas encore active dans le calcul du plan — on préfère te le dire plutôt que le laisser croire. En attendant, adapte l'intensité à ton ressenti selon ta phase."); }
  if(a.races==="oui") add("races","Courses intermédiaires","Hiérarchie A/B/C","Objectif C = on enchaîne. B = mini-affûtage. Récup placée juste après.");
  return R;
}

// ===== R3.9 / R3.10 UI — disponibilité à 4 états + calculateurs de test terrain =====
// Écrit directement dans S.answers.availability / S.answers.tests (des tableaux), que
// buildPlan consomme tels quels (a = S.answers). Aucune modification des appels moteur.
function ebAvailArr(){if(!Array.isArray(S.answers.availability))S.answers.availability=[];return S.answers.availability;}
function ebAvailSet(day,val){
  let arr=ebAvailArr().filter(x=>x.day!==day);
  const disc={run:"social-run",bike:"social-ride",swim:"social-swim",tri:"social-ride"}[S.sport]||"social-ride";
  const de=document.querySelector('[data-avdur="'+day+'"]');
  if(val==="blocked")arr.push({day:day,status:"blocked"});
  else if(val==="club-z2"||val==="club-seuil")arr.push({day:day,status:disc,durationMin:(de&&parseInt(de.value))||90,load:val==="club-seuil"?"seuil":"z2"});
  S.answers.availability=arr;
  if(de)de.style.display=(val.indexOf("club")===0)?"":"none";
}
function ebAvailDur(day,val){const e=ebAvailArr().find(x=>x.day===day);if(e)e.durationMin=parseInt(val)||90;}
function ebParseT(v){const m=String(v||"").split(":");return m.length===2?(+m[0])*60+(+m[1]):parseFloat(v);}
function ebAddTest(kind){
  if(!Array.isArray(S.answers.tests))S.answers.tests=[];
  const val=id=>{const el=document.getElementById(id);return el?el.value:"";};
  const dt=val("ebTestDate")||new Date().toISOString().slice(0,10);
  let t=null;
  if(kind==="ftp")t=fieldTests.ftp(parseFloat(val("ebFtpP20")),dt);
  else if(kind==="css")t=fieldTests.css(ebParseT(val("ebCss400")),ebParseT(val("ebCss50")),dt);
  else if(kind==="cs")t=fieldTests.cs(parseFloat(val("ebCsD3")),parseFloat(val("ebCsD10")),dt);
  else if(kind==="vma")t=fieldTests.vma(parseFloat(val("ebVmaD6")),dt);
  if(t&&isFinite(t.value)){S.answers.tests.push(t);ebSave();const b=document.getElementById("ebTestList");if(b)b.innerHTML=S.answers.tests.map(x=>"• "+esc(x.type)+" = "+esc(x.value)+" — "+esc(x.date)).join("<br>");}
}
// ===== §10 — LECTURE Strava (OAuth 2.0, jeton personnel) : alimente a.tests (R3.8) =====
// Lecture seule : on lit les activités récentes et on estime FTP / allure seuil / CSS.
// Aucune écriture vers Strava. CORS supporté par l'API GET Strava avec un bearer token.
const _fk100=s=>Math.floor(s/60)+"'"+String(Math.round(s%60)).padStart(2,"0");
async function stravaImport(){
  const tok=((document.getElementById("ebStravaTok")||{}).value||"").trim();
  const st=document.getElementById("ebStravaStatus");
  const setS=h=>{if(st)st.innerHTML=h;};
  if(!tok){setS("Colle d'abord un token d'accès Strava (Réglages → Mon API, scope <b>activity:read</b>).");return;}
  setS("Lecture de tes activités récentes…");
  try{
    const r=await fetch("https://www.strava.com/api/v3/athlete/activities?per_page=50",{headers:{Authorization:"Bearer "+tok}});
    if(!r.ok){setS("Strava a refusé la requête ("+r.status+"). Vérifie le token et le scope activity:read.");return;}
    const acts=await r.json();
    if(!Array.isArray(acts)||!acts.length){setS("Aucune activité récente trouvée.");return;}
    if(!Array.isArray(S.answers.tests))S.answers.tests=[];
    const today=new Date().toISOString().slice(0,10),added=[],notes=[];
    const sport=a=>a.sport_type||a.type||"";
    // FTP : uniquement si une sortie porte de la PUISSANCE (la vitesse seule ne dit rien de la FTP).
    const rides=acts.filter(a=>/Ride/.test(sport(a))&&(a.moving_time||0)>=1200);
    const powRides=rides.filter(a=>a.weighted_average_watts||a.average_watts);
    if(powRides.length){const best=powRides.reduce((m,a)=>Math.max(m,a.weighted_average_watts||a.average_watts||0),0);
      if(best>0){const ftp=Math.round(best*0.95);S.answers.tests.push({type:"ftp",value:ftp,date:today,source:"Strava (meilleure sortie ≥20min)"});added.push("FTP ≈ "+ftp+"W");}}
    else if(rides.length)notes.push("FTP non estimée : pas de capteur de puissance sur tes sorties. Saisis-la, ou fais un test 20min ci-dessus.");
    // Allure seuil : course récente la plus rapide EN MOYENNE — c'est un plancher conservateur
    // si tes sorties sont faciles. Un vrai seuil vient du protocole 3min/10min.
    const runs=acts.filter(a=>/Run/.test(sport(a))&&(a.moving_time||0)>=1200&&(a.average_speed||0)>0);
    if(runs.length){const fast=runs.reduce((m,a)=>Math.max(m,a.average_speed||0),0);
      if(fast>0){const sk=Math.round(1000/fast);S.answers.tests.push({type:"thrPace",value:sk,date:today,source:"Strava (course la plus rapide, estimation basse)"});added.push("allure de réf. ≈ "+_fk100(sk)+"/km");}}
    const swims=acts.filter(a=>/Swim/.test(sport(a))&&(a.moving_time||0)>=600&&(a.average_speed||0)>0);
    if(swims.length){const fast=swims.reduce((m,a)=>Math.max(m,a.average_speed||0),0);
      if(fast>0){const s100=Math.round(100/fast);S.answers.tests.push({type:"css",value:s100,date:today,source:"Strava (nage la plus rapide)"});added.push("CSS ≈ "+_fk100(s100)+"/100m");}}
    setS((added.length?("Importé : "+added.join(" · ")+". <span class='q-sub'>Valeurs estimées à partir de tes séances — affine avec un test si besoin.</span>"):"Aucune donnée d'allure/puissance exploitable.")+(notes.length?("<br><span class='q-sub'>⚠ "+notes.join(" ")+"</span>"):""));
    ebSave();const b=document.getElementById("ebTestList");if(b)b.innerHTML=(S.answers.tests||[]).map(x=>"• "+esc(x.type)+" = "+esc(x.value)+" — "+esc(x.date)+(x.source?" ("+esc(x.source)+")":"")).join("<br>");
  }catch(e){setS("Échec réseau (CORS ou token invalide). Tu peux saisir les tests à la main ci-dessus.");}
}

  function schema(phase,isRecup){
    if(isRecup){const d=[["facile","facileR"],["facile","facile2"],["off","off"],["facile","facileR"],["facile","facile2"],["facile","facileR"],["off","off"],["facile","facile2"],["facile","facileR"],["recup","recup"]];return (use10?d:d.slice(0,7)).map(x=>({charge:x[0],slot:x[1]}));}
    if(use10)return [["dur","dur1"],["facile","facileR"],["dur","dur2"],["facile","facile2"],["dur","facileR"],["facile","facileR"],["dur","dur2"],["facile","facile2"],["dur","durLong"],["recup","recup"]].map(x=>({charge:x[0],slot:x[1]}));
    return [["recup","recup"],["dur","dur1"],["facile","facileR"],["dur","dur2"],["facile","facile2"],["dur","durLong"],["facile","facileR"]].map(x=>({charge:x[0],slot:x[1]}));
  }
  const cycleLen=use10?10:7, totalDays=weeks*7, days=[];
  let cyc=0,dic=cycleLen,sinceR=0,sch=null,isR=false;
  const J=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  for(let i=0;i<totalDays;i++){
    const w=Math.floor(i/7), ph=phases.find(p=>w>=p.start&&w<p.end)||phases[4];
    if(dic>=cycleLen){cyc++;dic=0;isR=(ph.id!=="taper")&&(sinceR>=recupEvery-1);if(isR)sinceR=0;else sinceR++;sch=schema(ph.id,isR);}
    const s=sch[dic]||{charge:"facile",slot:"facileR"};const jn=J[i%7];let ch=s.charge,sl=s.slot,forced=false;
    if(offW.includes(jn)){ch="off";sl="off";forced=true;}
    const av=availMap[jn];let social=null;
    if(av){
      if(av.status==="blocked"){ch="off";sl="off";forced=true;}
      else if(typeof av.status==="string"&&av.status.indexOf("social")===0){
        const hard=/seuil|vo2|intens|dur/i.test(av.load||"");
        ch=hard?"dur":"facile";sl="social";forced=true;
        social={durationMin:parseInt(av.durationMin)||60,load:av.load||"z2",disc:av.status.replace("social-","")};
      }
    }
    days.push({week:w+1,jour:jn,cyc,jc:dic+1,charge:ch,slot:sl,forced,social,wasHard:(ch==="dur"&&forced),isR,phaseId:ph.id,phase:ph});dic++;
  }
  // redistribution durs bloqués (sans adjacence)
  for(let w=1;w<=weeks;w++){const wd=days.filter(d=>d.week===w);wd.filter(d=>d.wasHard).forEach(()=>{
    // chercher un facile dont les DEUX voisins (état courant) ne sont pas durs
    const t=wd.find((d,i)=>{
      if(d.charge!=="facile"||d.swapped)return false;
      const prev=wd[i-1],next=wd[i+1];
      return (!prev||prev.charge!=="dur")&&(!next||next.charge!=="dur");
    });
    if(t){t.charge="dur";t.slot="dur2";t.swapped=true;}
    // sinon : le dur est perdu cette semaine (sécurité > volume) — aucune adjacence créée
  });}
  // FIX CIBLÉ (history=reprise, formats à phase peak courte : marathon/gravel/ow…) :
  // le cycle use10 (10 jours) découple la cadence de récup des semaines, si bien que
  // TOUTE la phase peak peut tomber sur des semaines de récup → la séance signature
  // (slot durLong) est absente de la phase peak, voire aucune semaine peak de charge.
  // Correctif borné au calcul des semaines de phase : si la phase peak ne contient
  // aucune semaine de CHARGE portant durLong, on convertit sa dernière semaine en
  // semaine de charge avec la signature. Auto-déclenché : no-op si la peak est déjà saine.
  if((a.history||"confirme")==="reprise"){
    const peakWeekNums=[...new Set(days.filter(d=>d.phaseId==="peak").map(d=>d.week))];
    if(peakWeekNums.length){
      const isChargeSig=wn=>{const wd=days.filter(d=>d.week===wn);return wd.filter(d=>d.isR).length<4 && wd.some(d=>d.slot==="durLong"&&!d.forced);};
      if(!peakWeekNums.some(isChargeSig)){
        const targetWk=Math.max(...peakWeekNums);
        const wd=days.filter(d=>d.week===targetWk);
        const tpl=[["dur","dur1"],["facile","facileR"],["dur","dur2"],["facile","facile2"],["dur","durLong"],["facile","facileR"],["off","off"]];
        wd.forEach((d,idx)=>{
          d.isR=false;d.wasHard=false;d.swapped=false;
          if(d.forced){d.charge="off";d.slot="off";return;}
          const t=tpl[idx]||["facile","facileR"];d.charge=t[0];d.slot=t[1];
        });
      }
    }
  }
  // medHold : convertir les jours d'intensité (dur1/dur2) en jours faciles avant génération.
  // La sortie longue (durLong, endurance) est conservée ; on retire vo2max/seuil/vitesse.
  if(medHold)days.forEach(d=>{
    // Tri : le durLong = brick à allure course (intensité) → aussi converti. Run/bike/swim :
    // le durLong est de l'endurance pure (sortie longue), conservé.
    const stripLong=(sp==="tri");
    if(d.charge==="dur"&&(d.slot==="dur1"||d.slot==="dur2"||(stripLong&&d.slot==="durLong"))){d.charge="facile";d.slot=(sp==="run")?"facile2":"facileR";}
  });
  // Date absolue par jour (R3.1/R3.8) : le plan se termine à la date de course (ou à
  // aujourd'hui + durée). Chaque séance se rend avec la référence datée valide à sa date.
  const _MS=864e5;
  const _end=a.race_date?new Date(a.race_date+"T00:00:00Z"):new Date(Date.now()+(totalDays-1)*_MS);
  const _iso=t=>new Date(t).toISOString().slice(0,10);
  days.forEach((d,i)=>{
    const ph=d.phase; const prog=ph.weeks>1?((d.week-1)-ph.start)/(ph.weeks-1):0.5;
    d.prog=Math.max(0,Math.min(1,prog));
    d.date=_iso(_end.getTime()-(totalDays-1-i)*_MS);
    d.sessions=sess(d.slot,d.phaseId,d.prog);
    const refs=refsAt(d.date);
    if(d.social){ // R3.9 — créneau club : séance à durée FIXE (jamais scalée), comptée au volume
      const disc=d.social.disc==="run"?"rn":d.social.disc==="swim"?"sw":"bk";
      const zone=disc==="bk"?(/seuil/i.test(d.social.load)?"bk.thr":"bk.z2"):disc==="rn"?(/seuil/i.test(d.social.load)?"rn.thr":"rn.easy"):"sw.easy";
      const nm={bk:"Sortie club vélo",rn:"Sortie club course",sw:"Créneau club nage"}[disc];
      const so={d:disc,name:nm,social:true,note:"Créneau imposé (club) — décompté du budget de la semaine.",steps:[{role:"body",durationMin:disc==="sw"?null:d.social.durationMin,distanceM:disc==="sw"?Math.round(d.social.durationMin*100/(baseRefs.css||130)*60):null,zone:zone,intensity:intOf(zone),d:disc}]};
      renderSess(so,refs);d.sessions=[so];
    } else d.sessions.forEach(s=>{if(s.steps&&s.steps.length)renderSess(s,refs);else if(s.min==null)s.min=(s.d==="rs")?0:0;});
  });
  // C18b — UN SEUL « VO2max course » garanti par semaine de peak (C18) : le second
  // créneau facileR redevient footing — deux VO2 course + VO2 vélo + brick feraient
  // 4 jours durs, et la semaine de peak perdait du volume (les VO2 courts sont plus
  // petits que les footings qu'ils remplacent → le pic tombait sous la fin de spec).
  if(sp==="tri"){
    for(let w=1;w<=weeks;w++){
      const wd=days.filter(d=>d.week===w&&d.sessions.some(x=>x.name==="VO2max course"));
      for(let i=1;i<wd.length;i++){
        const d=wd[i];
        d.sessions=sess("facileR","spec",d.prog||0);
        const refs=refsAt(d.date);
        d.sessions.forEach(x=>{if(x.steps&&x.steps.length)renderSess(x,refs);});
      }
    }
  }
  // PLAFOND JOURS D'IMPACT COURSE — à la racine, sur fenêtre glissante de 7 jours.
  // La course est le sport à plus fort impact : on convertit l'excédent en repos ou cross-training vélo.
  if(sp==="run"){
    const injImpact=(a.injury||"").split(",").some(x=>["tibia","genou","pied","hanche"].includes(x));
    let maxRun={reprise:4,confirme:5,ancien:6}[a.history||"confirme"]||5;
    if(injImpact)maxRun=Math.max(3,maxRun-1);
    const canCross=(a.dispo==="quotidienne"||a.dispo==="semaine");
    for(let w=1;w<=weeks;w++){
      const wd=days.filter(d=>d.week===w);
      const isRecupWk=wd.filter(d=>d.isR).length>=4;
      const cap=isRecupWk?Math.max(2,maxRun-1):maxRun;
      let runDays=wd.filter(d=>d.sessions.some(s=>s.d==="rn"));
      let over=runDays.length-cap;
      if(over<=0)continue;
      // priorité de conversion : faciles d'abord, puis si besoin les durs surnuméraires
      const ordered=[...runDays.filter(d=>d.charge==="facile"&&!d.forced),...runDays.filter(d=>d.charge==="dur"&&!d.forced)];
      for(let i=0;i<ordered.length&&over>0;i++){
        const d=ordered[i];
        if(canCross&&(injImpact||d.charge==="dur")){
          // garder le stimulus en cross-training vélo (zéro impact)
          d.sessions=[d.charge==="dur"
            ?{d:"bk",name:"Cross-training vélo (intensité)",note:"Intervalles vélo — équivalent VO2 sans impact, maintient la puissance aérobie pendant que le tissu se répare.",steps:[{role:"warmup",durationMin:15,text:"progressif"},{role:"body",reps:5,durationMin:3,zone:"bk.vo2",intensity:intOf("bk.vo2"),recoveryText:"3min souple",suffix:"",prefix:""},{role:"cooldown",durationMin:10,text:"souple"}]}
            :{d:"bk",name:"Cross-training vélo",plainBody:true,note:"Zéro impact : le stimulus aérobie est conservé pendant que les tissus de la course récupèrent.",steps:[{role:"body",durationMin:55,zone:"bk.z2",intensity:intOf("bk.z2"),suffix:"",prefix:""}]}];
        } else {
          d.charge="off";d.slot="off";d.sessions=[{d:"rs",name:"OFF (récup impact)",det:"repos — la course use, le tissu se reconstruit au repos"}];
        }
        over--;
      }
    }
  }
  // RESPECT DU BUDGET DE SÉANCES déclaré : convertir les jours faciles excédentaires en repos
  // (on calcule un budget hebdo ; en cycle 10j on rapporte au prorata)
  // Budget séances implicite du volume : à faible dispo horaire, moins de séances
  // (on ne prescrit pas 6 sorties/semaine à quelqu'un qui a 5h). Le swim est exclu :
  // en natation la fréquence prime (séances courtes techniques), ses heures "génériques" sont gonflées.
  const volBudget=Math.min(parseInt(a.vol_max||"10"),caps,util)*marg;
  const avgSessH={run:1.15,bike:1.3,tri:1.2}[sp];
  const volSessCap=avgSessH?Math.max(3,Math.round(volBudget/avgSessH)):7;
  const declSess=Math.min(parseInt(a.sessions_max)||7,volSessCap);
  const budgetPerWeek=declSess;
  // Le nombre de jours actifs par semaine ne doit JAMAIS dépasser budgetPerWeek —
  // y compris les semaines de récup (elles ont beaucoup de jours faciles). On retire
  // d'abord les faciles, puis les durs non-signature, puis en dernier recours n'importe
  // quel jour non forcé (le durLong/signature est retiré en tout dernier).
  const toOff=d=>{d.charge="off";d.slot="off";d.sessions=[{d:"rs",name:"OFF (budget séances)",det:"repos — respect de ta disponibilité déclarée"}];};
  for(let w=1;w<=weeks;w++){
    const wd=days.filter(d=>d.week===w);
    const activeNow=()=>wd.filter(d=>d.charge!=="off"&&d.charge!=="recup");
    let over=activeNow().length-budgetPerWeek;
    if(over<=0)continue;
    const fac=activeNow().filter(d=>d.charge==="facile"&&!d.forced);
    for(let i=fac.length-1;i>=0&&over>0;i--){toOff(fac[i]);over--;}
    if(over>0){const durs=activeNow().filter(d=>d.charge==="dur"&&!d.forced&&d.slot!=="durLong");
      for(let i=durs.length-1;i>=0&&over>0;i--){toOff(durs[i]);over--;}}
    if(over>0){const any=activeNow().filter(d=>!d.forced);
      for(let i=any.length-1;i>=0&&over>0;i--){toOff(any[i]);over--;}}
  }
  // renfo/gammes par sport — DOIT rester dans le budget de séances déclaré
  const declMax=parseInt(a.sessions_max)||7;
  for(let w=1;w<=weeks;w++){
    const wd=days.filter(d=>d.week===w);if(wd[0]?.isR)continue;const ph=wd[0]?.phaseId;if(ph==="taper")continue;
    // compter les séances "réelles" (hors repos) déjà posées cette semaine
    const realCount=()=>wd.filter(d=>d.sessions.some(s=>s.d!=="rs")).length;
    // budget restant pour des séances de renfo (le renfo greffé EN FIN d'une séance existante ne compte pas en plus ;
    // on ne crée une "journée renfo seule" que s'il reste du budget)
    const faciles=wd.filter(d=>d.charge==="facile"&&!d.forced);
    // priorité : greffer le renfo SUR une séance existante (même jour) → ne consomme pas de budget
    const graft=(day,obj)=>{ if(day&&day.sessions.some(s=>s.d!=="rs"))day.sessions.push(obj); };
    if(sp==="run"){
      graft(faciles[0],{d:"rs",name:inj.includes("tibia")?"+ Renfo tibial":"+ Renfo + gainage",det:"20min en fin de footing"});
      // plio : greffée sur une séance existante (jamais une journée en plus), GRADUÉE selon le profil
      const injImpactP=(a.injury||"").split(",").some(x=>["tibia","genou","pied","hanche","course"].includes(x));
      const beginnerR=a.level==="debutant"||a.intent==="finir";
      let plioDet;
      if(injImpactP) plioDet="renfo excentrique (pas de sauts — protection)";
      else if(beginnerR) plioDet="corde à sauter, rebonds souples (initiation douce)"; // débutant : jamais au-delà de l'initiation
      else plioDet=ph==="base"?"corde à sauter, rebonds souples":ph==="dev"?"squat jumps, box jumps bas":"pliométrie réactive";
      graft(faciles[2]||faciles[1],{d:"rs",name:"+ Plio",det:plioDet});
    } else if(sp==="bike"){
      graft(faciles[0],{d:"rs",name:"+ Gainage position",det:"20min en fin de séance"});
      if(ph==="spec")graft(faciles[1],{d:"rs",name:"+ Force max",det:"squat/presse 4×5"});
    } else if(sp==="swim"){
      graft(faciles[0],{d:"rs",name:"+ Renfo épaules",det:"15min coiffe en fin de séance"});
    }
  }
  // PASSE FINALE ANTI-COLLAGE : après toutes les transformations (budget, impact, OFF forcés),
  // si deux jours durs sont devenus adjacents, alléger le second en facile.
  for(let i=0;i<days.length-1;i++){
    if(days[i].charge==="dur"&&days[i+1].charge==="dur"&&!days[i+1].forced){
      // rétrograder le 2e en facile (récup active) sans le supprimer
      days[i+1].charge="facile";
      const sp2=S.sport;
      days[i+1].sessions=sess(sp2==="run"?"facile2":"facileR",days[i+1].phaseId,days[i+1].prog||0);
    }
  }
  // GARANTIE POLARISATION : sur petit budget, éviter une semaine 100% dure.
  // Au moins 1 jour facile dès qu'il y a ≥2 jours actifs.
  for(let w=1;w<=weeks;w++){
    const wd=days.filter(d=>d.week===w);
    if(wd[0]?.isR)continue;
    const active=wd.filter(d=>d.charge!=="off"&&d.charge!=="recup");
    const faciles=active.filter(d=>d.charge==="facile");
    if(active.length>=2&&faciles.length===0){
      // convertir le dernier jour dur (souvent la "longue") en jour facile d'endurance
      const durs=active.filter(d=>d.charge==="dur"&&!d.forced);
      if(durs.length>=2){
        // Ne jamais sacrifier la sortie longue : convertir de préférence un dur non-longue
        const nonLong=durs.filter(d=>d.slot!=="durLong");
        const victim=nonLong.length?nonLong[nonLong.length-1]:durs[durs.length-1];
        victim.charge="facile";
        victim.slot=(sp==="run")?"facileR":(sp==="bike")?"facileR":(sp==="swim")?"facileR":"facileR";
        victim.sessions=sess(victim.slot,victim.phaseId,victim.prog||0);
      }
    }
  }
  // ===== R3.2 — VOLUME PAR SOMMATION DES CHAMPS (plus aucun reparse de texte) =====
  const weekMin=wd=>wd.reduce((t,d)=>t+d.sessions.reduce((u,s)=>u+(s.min||0),0),0);
  const renderWeek=wd=>wd.forEach(d=>{const refs=refsAt(d.date);d.sessions.forEach(s=>{if(s.steps&&s.steps.length)renderSess(s,refs);else if(s.min==null)s.min=0;});});
  // ===== R3.4b — planchers ET plafonds de séance (symétriques), par type et par format =====
  const CAP_BRICK={S:90,M:120,"70.3":180,Full:300};
  const CAP_BRICK_RUN={S:20,M:24,"70.3":32,Full:70};
  // C21 — athlète en REPRISE : le brick ne mange pas la semaine. Sur Full, un brick plein
  // (300min vélo + 70min CAP) atteignait 61% du volume hebdo d'une reprise (note.md :
  // alerte >55%) — la charge se concentre sur un seul jour, risque de blessure. Plafonds
  // ×0.8 pour l'historique « reprise » ; les bornes format (audit 2) restent respectées
  // (240min ∈ [150, 300] sur Full). Le leg CAP du brick gagne au passage un vrai plafond.
  const _brickRF=(a.history==="reprise")?0.8:1;
  const CAP_SWIM={sprint:1400,demifond:2000,fond:3000,ow:4500,S:750,M:1500,"70.3":1900,Full:3000};
  const CAP_LONG={"5k":74,"10k":90,semi:130,marathon:180,trail:255,crit:150,route:180,clm:165,cyclo:240,gravel:360};
  // R3.11 — bornes dérivées de la MÊME source que la génération (b.bnd, posé depuis
  // distCaps/durCaps dans sess()), et non de tables parallèles qui divergent. R3.12 — le
  // plafond de la séance longue suit la phase (_capScale = Lval), il n'est plus constant :
  // la longue atteint son cap en spécifique, pas en semaine 1.
  let _capScale=1;
  function blockBounds(b,s){
    if(b.bnd){
      const sc=_capScale;
      if(b.distanceM!=null){ // nage/distance : plancher C8 (≥800m) seulement si séance « longue »
        const fl=s.long?800:Math.min(b.bnd.floor,beginner?600:750); // C24
        return{floor:fl,cap:Math.max(fl,Math.round(b.bnd.cap*sc))};
      }
      // Course/vélo : plancher = minimum digne (C8), pas la borne basse du format — sinon la
      // longue démarre déjà au plafond et ne progresse plus (C16).
      const fl=s.d==="bk"?35:30;
      return{floor:fl,cap:Math.max(fl,Math.round(b.bnd.cap*sc))};
    }
    if(s.brick){if(b.leg==="bike")return{floor:32,cap:Math.round((CAP_BRICK[fmt]||300)*_brickRF)};return{floor:8,cap:Math.round((CAP_BRICK_RUN[fmt]||70)*_brickRF)};}
    if(s.long){
      if(s.d==="sw")return{floor:820,cap:CAP_SWIM[fmt]||4500};
      if(s.d==="rn")return{floor:30,cap:CAP_LONG[fmt]||9999};
      if(s.d==="bk")return{floor:35,cap:CAP_LONG[fmt]||9999};
    }
    if(b.distanceM!=null)return{floor:((b.d||s.d)==="sw"&&!beginner)?750:100,cap:9999}; // C24
    return{floor:3,cap:9999};
  }
  // R3.4b — le scaling ne touche QUE les steps role=body, borné [floor,cap]. Les blocs
  // d'intervalle ajustent le NOMBRE de reps (durée de bloc quasi fixe) ; les blocs uniques
  // ajustent leur durée/distance. warmup/cooldown ne scalent jamais (rendus ≤ corps).
  function scaleBlock(b,f,s){
    if(b.role!=="body")return;
    const bd=blockBounds(b,s);
    if(b.distanceM!=null){
      if((b.reps||1)>1){const tot=(b.reps)*b.distanceM*f;b.reps=Math.max(1,Math.min(15,b.repCap||15,Math.round(tot/b.distanceM)));}
      else b.distanceM=Math.max(bd.floor,Math.min(bd.cap,Math.round(b.distanceM*f/25)*25));
    } else if(b.durationMin!=null){
      if((b.reps||1)>1){const tot=b.reps*b.durationMin*f;b.durationMin=Math.max(bd.floor,Math.min(bd.cap,b.durationMin));b.reps=Math.max(1,Math.min(15,b.repCap||15,Math.round(tot/b.durationMin)));}
      else b.durationMin=Math.max(bd.floor,Math.min(bd.cap,Math.round(b.durationMin*f)));
    }
    // C15 — protection débutant nage : aucune séance de nage > 850m, tous blocs confondus.
    if(beginner&&s.d==="sw"&&b.distanceM!=null){
      const cap=850,reps=b.reps||1;
      if(reps*b.distanceM>cap){if(reps>1)b.reps=Math.max(1,Math.floor(cap/b.distanceM));else b.distanceM=Math.floor(cap/25)*25;}
    }
  }
  const scaleWeekBody=(wd,f)=>wd.forEach(d=>d.sessions.forEach(s=>{if(s.social)return;if(s.steps)s.steps.forEach(b=>scaleBlock(b,f,s));}));
  const clampWeekBody=wd=>scaleWeekBody(wd,1); // applique planchers/plafonds sans scaler
  // Courbe de charge normalisée (globale) : rampe base→peak, pic large (≥2 sem ≥0.9×pic),
  // taper strictement décroissant. Elle PILOTE le budget de chaque semaine (R3.3).
  const bands={base:[0.50,0.68],dev:[0.68,0.92],spec:[0.94,1.0],peak:[1.0,1.0],taper:[0.55,0.30]};
  const Lval=(id,prog)=>{const b=bands[id]||[0.6,0.9];return b[0]+(b[1]-b[0])*Math.max(0,Math.min(1,prog));};
  const theoPeak=Math.min(parseInt(a.vol_max||"10"),caps,util)*marg*recupFactor;
  const capH=parseInt(a.vol_max||"10");           // plafond dur = vol_max (C3)
  const medFactor=medHold?0.4:1;                   // plan de maintien médical : pic allégé
  let peakH=Math.min(theoPeak,capH)*medFactor;
  // C20 — nage DÉBUTANT : la promesse suit la capacité réelle. Avec C15 (≤850m/séance,
  // technique avant volume), une séance plafonne ≈25min (850m corps + échauffement/RC),
  // soit ~0.42h × séances/semaine au maximum. Sans ce cap, la courbe déclarée promettait
  // des heures que le contenu ne peut pas tenir (audit : 10h déclarées, 2.3h réelles).
  if(sp==="swim"&&beginner)peakH=Math.min(peakH,(parseInt(a.sessions_max)||6)*0.42);
  const wl=[];
  let _maxChargeMin=0; // pic réel (minutes) des semaines de charge déjà générées — sert à R3.13
  let _prevLw=0;       // niveau de la dernière semaine de charge — sert à C22
  for(let w=0;w<weeks;w++){
    const ph=phases.find(p=>w>=p.start&&w<p.end)||phases[4];
    const prog=ph.weeks>1?(w-ph.start)/(ph.weeks-1):(ph.id==="taper"?0.5:1);
    const wd=days.filter(d=>d.week===w+1);
    const isRW=wd.filter(d=>d.isR).length>=4;
    let Lw=Lval(ph.id,prog);
    // C22 — PROGRESSION LISSÉE : jamais +10% d'une semaine de charge à la suivante
    // (manifeste note.md : « une progression de volume incohérente » est interdite).
    // Les phases courtes faisaient sauter la courbe (base 0.50→0.68 en 2 semaines = +36%).
    // Conséquence assumée : les plans courts (5k 6 sem.) plafonnent sous le pic théorique —
    // santé avant performance. Les semaines récup héritent du niveau lissé (×0.62 ensuite) ;
    // l'affûtage n'est pas concerné (il descend), et R3.13 garantit sa réduction ≥40%.
    if(ph.id!=="taper"&&_prevLw>0)Lw=Math.min(Lw,_prevLw*1.10);
    if(ph.id!=="taper"&&!isRW)_prevLw=Lw;
    // R3.12 — plafond longue = cap_format × échelle de phase, plus raide que le volume (0.40
    // en base → 1.0 au pic) pour que la longue progresse vraiment (C16), pas juste le budget.
    _capScale=Math.max(0.40,Math.min(1,(Lw-0.5)*1.2+0.4));
    let targetH=Lw*peakH;
    if(isRW)targetH*=0.62;
    targetH=Math.min(targetH,capH);               // jamais > vol_max
    // R3.3 — ajuster le CORPS des séances à la cible de la courbe (itératif : warmup/cooldown
    // suivent le corps au rendu, donc quelques passes convergent).
    for(let it=0;it<5;it++){
      renderWeek(wd);
      const cur=weekMin(wd)/60;
      if(cur<=0||targetH<=0)break;
      const f=targetH/cur;
      if(f>0.99&&f<1.01)break;
      scaleWeekBody(wd,f);
    }
    clampWeekBody(wd); renderWeek(wd);           // planchers (C8) + plafonds (C12) garantis
    // Plafond dur vol_max (C3) : si les planchers longue débordent, réduire le corps non-longue.
    for(let g=0;g<3;g++){
      const vh=weekMin(wd)/60; if(vh<=capH*1.03)break;
      const longH=wd.reduce((t,d)=>t+d.sessions.reduce((u,s)=>u+((s.long&&s.d!=="rs")?(s.min||0):0),0),0)/60;
      const nlH=vh-longH, room=Math.max(0,capH*1.0-longH);
      if(nlH<=0)break;
      wd.forEach(d=>d.sessions.forEach(s=>{if(s.long||s.social||!s.steps)return;s.steps.forEach(b=>scaleBlock(b,room/nlH,s));}));
      renderWeek(wd);
    }
    // R3.13 — AFFÛTAGE : quand les planchers de séance (échauffements/retours au calme
    // incompressibles, caps débutant C15) empêchent R3.3 de descendre assez, la FRÉQUENCE
    // cède : on convertit les jours faciles les plus légers en OFF jusqu'à passer sous 55%
    // du pic réel (spec audit 2 : réduction ≥40%). Le repos vaut mieux que des mètres
    // « poubelle » en semaine de course, surtout chez le débutant.
    if(ph.id==="taper"&&_maxChargeMin>0){
      for(let g=0;g<3;g++){
        if(weekMin(wd)<=_maxChargeMin*0.55)break;
        const active=wd.filter(d=>d.charge!=="off"&&d.sessions.some(s=>s.d!=="rs"));
        if(active.length<=3)break;
        const cand=active.filter(d=>d.charge==="facile"&&!d.forced&&!d.sessions.some(s=>s.long||s.brick));
        if(!cand.length)break;
        const dayMin=d2=>d2.sessions.reduce((t,s)=>t+(s.min||0),0);
        const victim=cand.reduce((a,b)=>dayMin(b)<dayMin(a)?b:a);
        victim.charge="off";victim.slot="off";
        victim.sessions=[{d:"rs",name:"OFF (affûtage)",det:"repos — la fraîcheur du jour J se construit maintenant",steps:[]}];
      }
    }
    const volReal=Math.round(weekMin(wd)/60*10)/10;
    if(!isRW&&ph.id!=="taper")_maxChargeMin=Math.max(_maxChargeMin,weekMin(wd));
    wl.push({num:w+1,phase:ph,vol:volReal,vol_declared:Math.round(targetH*10)/10,vol_real:volReal,days:wd,isRecup:isRW});
  }
  // volPeak = pic réel des semaines de charge (cohérent avec le contenu généré — C6).
  {const chargeW=wl.filter(w=>!w.isRecup);if(chargeW.length)volPeak=Math.max(...chargeW.map(w=>w.vol));}
  volBase=Math.round(volPeak*0.58*10)/10;
  // COURSES INTERMÉDIAIRES : repérer la semaine de chaque course, marquer + ajuster le volume
  const races=[];
  if(a.races==="oui"){
    if(a.race1_date)races.push({date:a.race1_date,prio:a.race1_prio||"C"});
    if(a.race2_date)races.push({date:a.race2_date,prio:a.race2_prio||"C"});
  }
  races.forEach(r=>{
    const wIdx=Math.floor((new Date(r.date)-Date.now())/(7*864e5));
    const wk=wl.find(w=>w.num===wIdx+1);
    if(wk){
      wk.race=r.prio;
      // B ou A → mini-affûtage la semaine de course (-25%) ; récup la semaine suivante
      if(r.prio!=="C"){wk.vol=Math.round(wk.vol*0.75*10)/10;wk.taperRace=true;}
      const next=wl.find(w=>w.num===wk.num+1);
      if(next){next.vol=Math.round(next.vol*0.7*10)/10;next.postRace=true;}
    }
  });
  return {weeks:wl,phases,volPeak,volBase,use10,totalWeeks:weeks,races};
}

// ===== R3.10 — protocoles de test terrain (4 fonctions pures) → entrées a.tests (R3.8) =====
const fieldTests={
  css:(t400,t50,date)=>{const mps=350/(t400-t50);return{type:"css",value:Math.round(100/mps),date:date||null,source:"400m TT − 50m TT"};},
  cs:(d3,d10,date)=>{const mps=(d10-d3)/420;return{type:"thrPace",value:Math.round(1000/mps),date:date||null,source:"3min max / 10min max"};},
  vma:(d6,date)=>({type:"vma",value:Math.round(d6/100*10)/10,date:date||null,source:"6min max (demi-Cooper)"}),
  ftp:(p20,date)=>({type:"ftp",value:Math.round(0.95*p20),date:date||null,source:"20min TT"})
};
// ===== §11 — contrat de sortie : plan en JSON structuré, indépendant du rendu HTML =====
function planToJSON(a){
  const p=buildPlan(a);
  return {
    meta:{sport:a.sport||S.sport,format:a.format,raceDate:a.race_date||null,volPeak:p.volPeak,volBase:p.volBase,totalWeeks:p.totalWeeks},
    tests:Array.isArray(a.tests)?a.tests:[],
    weeks:p.weeks.map(w=>({num:w.num,phase:w.phase.id,isRecup:w.isRecup,targetMin:Math.round((w.vol_declared||w.vol)*60),
      days:w.days.map(d=>({date:d.date,sessions:d.sessions.filter(s=>s.d!=="rs").map(s=>({
        d:s.d,name:s.name,long:!!s.long,min:Math.round(s.min||0),

// ===== Suivi de charge : TSS estimé (sans capteur) → CTL/ATL/TSB (fitness/fatigue/forme) =====
// IF (facteur d'intensité) par zone, dérivé des références relatives (ZDEF). TSS d'un bloc =
// durée(h) × IF² × 100. Warmup/cooldown à IF 0.5. Aucune donnée capteur requise.
const _IFZ={"bk.z2":.65,"bk.ss":.90,"bk.vo2":1.12,"bk.frc":.82,"bk.rp":.84,"bk.thr":1.0,
  "rn.easy":.68,"rn.mara":.84,"rn.thr":.98,"rn.vo2":1.10,"rn.rec":.60,
  "sw.easy":.65,"sw.aero":.75,"sw.css":.95,"sw.speed":1.08};
function _blkMin(st){const r=st.reps||1;if(st.durationMin!=null)return r*st.durationMin;if(st.distanceM!=null)return st.d==="sw"?r*st.distanceM/100*2:r*st.distanceM/1000*5;return 0;}
function estimateTSS(s){if(!s||!s.steps||!s.steps.length)return 0;let t=0;s.steps.forEach(st=>{const mn=_blkMin(st);const IF=st.role==="body"?(_IFZ[st.zone]||0.70):0.5;t+=(mn/60)*IF*IF*100;});return Math.round(t);}
function loadSeries(plan){
  const days=[];plan.weeks.forEach(w=>w.days.forEach(d=>{let tss=0;d.sessions.forEach(s=>{if(s.d!=="rs")tss+=estimateTSS(s);});days.push({week:w.num,jour:d.jour,tss:tss,recup:w.isRecup});}));
  const seed=days.slice(0,7).reduce((a,d)=>a+d.tss,0)/7||0;let ctl=seed,atl=seed;const out=[];
  days.forEach(d=>{const tsb=ctl-atl;ctl+=(d.tss-ctl)/42;atl+=(d.tss-atl)/7;out.push({week:d.week,ctl:ctl,atl:atl,tsb:tsb});});
  // échantillon hebdo = dernière valeur de chaque semaine
  const byWeek={};out.forEach(o=>byWeek[o.week]=o);
  return Object.keys(byWeek).map(k=>byWeek[k]);
}
function loadChartSVG(plan){
  const S2=loadSeries(plan);if(!S2.length)return"";
  const W=Math.max(320,S2.length*22),H=150,PL=34,PR=10,PT=12,PB=22,iw=W-PL-PR,ih=H-PT-PB;
  const maxL=Math.max(1,...S2.map(o=>Math.max(o.ctl,o.atl)));
  const tsbMax=Math.max(10,...S2.map(o=>Math.abs(o.tsb)));
  const x=i=>PL+(S2.length<2?iw/2:i/(S2.length-1)*iw);
  const yL=v=>PT+ih-(v/maxL)*ih;              // CTL/ATL (0..max)
  const yB=v=>PT+ih/2-(v/tsbMax)*(ih/2);      // TSB (centré sur 0)
  const line=(sel,col,w)=>"<polyline fill=\"none\" stroke=\""+col+"\" stroke-width=\""+w+"\" points=\""+S2.map((o,i)=>x(i).toFixed(1)+","+sel(o).toFixed(1)).join(" ")+"\"/>";
  let g="<svg viewBox=\"0 0 "+W+" "+H+"\" width=\"100%\" style=\"max-width:"+W+"px;display:block;margin:6px auto\" role=\"img\" aria-label=\"Courbe de charge CTL ATL TSB\">";
  g+="<line x1=\""+PL+"\" y1=\""+(PT+ih/2)+"\" x2=\""+(W-PR)+"\" y2=\""+(PT+ih/2)+"\" stroke=\"#0002\" stroke-dasharray=\"3 3\"/>";
  g+=line(o=>yB(o.tsb),"#00a376",2)+line(o=>yL(o.ctl),"#2e6bff",2.5)+line(o=>yL(o.atl),"#ff7a1a",1.8);
  g+="<text x=\"2\" y=\""+(PT+8)+"\" font-size=\"9\" fill=\"#635b4a\">charge</text>";
  g+="</svg>";
  return g;
}

function hrZones(age         , hrMax         , hrRest         ) {
  const fcMax = parseInt(hrMax || "") || Math.round(208 - 0.7 * (parseInt(age || "") || 35));
  const rest = parseInt(hrRest || "") || 0;
  const Z = (lo        , hi        ) => {
    if (rest) return Math.round(rest + (fcMax - rest) * lo) + "-" + Math.round(rest + (fcMax - rest) * hi) + " bpm";
    return Math.round(fcMax * lo) + "-" + Math.round(fcMax * hi) + " bpm";
  };
  return { fcMax, z1: Z(0.6, 0.7), z2: Z(0.7, 0.8), tempo: Z(0.8, 0.87), seuil: Z(0.87, 0.92), vo2: Z(0.92, 0.97) };
}

function parsePaceSec(v         )         {
  if (!v || !/^\d+[:h.]\d+$/.test(v.trim())) return 0;
  const m = v.trim().split(/[:h.]/);
  return parseInt(m[0]) * 60 + parseInt(m[1]);
}

    const marg = comp ? MARGIN.competition : MARGIN.autres;
    D("capacite", "Plafond historique", caps + "h/sem", "Ce que l'historique « " + history + " » permet d'encaisser sur " + fmt);
    D("utile", "Volume utile du format", util + "h/sem", "Au-delà, les heures ne servent plus l'objectif " + fmt);
    if (!comp) D("marge", "Marge de sécurité", "-10%", "Hors compétition, 10% de marge sur tous les plafonds (santé d'abord)");

    // 1B — indicateurs de récupération
    const recupFactor = (a.sleep === "court" ? RECUP_FACTORS.sleepCourt : 1) * (a.life_load === "lourde" ? RECUP_FACTORS.lifeLourde : 1);
    if (recupFactor < 1) D("1B", "Récupération dégradée", "volume ×" + recupFactor.toFixed(2), "Sommeil court et/ou charge de vie lourde : le contenu baisse réellement");

    const volMax = parseInt(a.vol_max || "10");
    const sessionScale = Math.min(1, (Math.min(volMax, caps, util) * marg) / util) * recupFactor;
    let volPeak = Math.round(Math.min(volMax, caps, util) * marg * recupFactor * 10) / 10;
    if (sp === "swim" && beginner) {
      volPeak = Math.min(volPeak, BEGINNER_SWIM_VOLPEAK_CAP_H);
      D("C15", "Nageur débutant", "pic ≤" + BEGINNER_SWIM_VOLPEAK_CAP_H + "h", "La technique borne le volume, pas l'historique (risque épaule)");
    }
    if (sp === "swim") volPeak = Math.round(volPeak * SWIM_TIME_FACTOR * 10) / 10;

    // ---- 3. Comprendre les contraintes : médical, jours, budget ----
    const medHold = a.med_pain === "oui" || a.med_dizzy === "oui" || a.med_treat === "oui";
    if (medHold) D("medical", "⚠️ Drapeau médical", "plan de maintien", "Aucune intensité générée sans feu vert médical ; pic allégé à 40%");
    const offDays = (a.off_which || "").split(",").filter(Boolean);
    const use10 = a.dispo === "quotidienne" && a.shift_ok === "oui" && offDays.length < 2;
    if (use10) D("cycle", "Cycle de 10 jours", "activé", "Disponibilité quotidienne : densité mieux répartie qu'en semaine de 7 jours");
    const recupEvery = RECUP_EVERY[history];
    D("recup", "Semaine de récupération", "toutes les " + recupEvery + " semaines", history === "reprise" ? "Reprise : récupération plus fréquente" : "Assimilation régulière de la charge");

    const volBudget = Math.min(volMax, caps, util) * marg;
    const avgH = AVG_SESSION_H[sp];
    const volSessCap = avgH ? Math.max(3, Math.round(volBudget / avgH)) : 7;
    const budgetPerWeek = Math.min(parseInt(a.sessions_max || "7") || 7, volSessCap);
    D("budget", "Séances par semaine", budgetPerWeek, "Budget déclaré ∧ budget implicite du volume (" + volBudget.toFixed(1) + "h ÷ " + (avgH ?? "—") + "h/séance)");

    const injuries = (a.injury || "").split(",").filter((x) => x && x !== "aucune");
    let maxRunDays                = null;
    if (sp === "run") {
      const injImpact = injuries.some((x) => ["tibia", "genou", "pied", "hanche"].includes(x));
      maxRunDays = MAX_RUN_DAYS[history] ?? 5;
      if (injImpact) maxRunDays = Math.max(3, maxRunDays - 1);
      D("impact", "Jours de course max", maxRunDays + "/semaine", "La course est le sport à plus fort impact" + (injImpact ? " — blessure d'impact déclarée, -1 jour" : ""));
    }

    // ---- 4. Calculer la charge : phases (C19) et courbe (bands + C22) ----
    const phases          = PHASE_PCTS.map((p) => ({ ...p, start: 0, end: 0, weeks: 0 }));
    let acc = 0;
    for (const p of phases) {
      p.start = Math.round(acc * weeks);
      acc += p.pct;
      p.end = Math.round(acc * weeks);
      p.weeks = p.end - p.start;
    }
    phases[4].end = weeks;
    {
      const pk = phases[3], spc = phases[2];
      if (pk.weeks < 1 && spc.weeks >= 2) {
        spc.end--; spc.weeks--;
        pk.start = spc.end; pk.end = pk.start + 1; pk.weeks = 1;
        D("C19", "Semaine de peak garantie", "S" + (pk.start + 1), "Les arrondis vidaient la phase peak des plans courts — la dernière semaine de spec devient le pic");
      }
      phases[4].start = phases[3].end;
      phases[4].weeks = phases[4].end - phases[4].start;
    }
    D("courbe", "Courbe de charge", "base " + BANDS.base[0] + "→peak 1.0→affûtage " + BANDS.taper[1], "Bandes normalisées × pic, récup ×" + RECUP_WEEK_FACTOR + ", lissage C22 ≤+" + Math.round((C22_MAX_WEEKLY_GROWTH - 1) * 100) + "%/sem");

    const medFactor = medHold ? 0.4 : 1;
    const theoPeak = Math.min(volMax, caps, util) * marg * recupFactor;
    let peakH = Math.min(theoPeak, volMax) * medFactor;
    // C20 — nage débutant : la promesse suit la capacité réelle C15
    if (sp === "swim" && beginner) {
      const cap20 = (parseInt(a.sessions_max || "6") || 6) * C20_BEGINNER_SWIM_H_PER_SESSION;
      if (peakH > cap20) {
        peakH = cap20;
        D("C20", "Promesse calibrée", peakH.toFixed(1) + "h max", "Une séance C15 ≈ 25min : promettre plus serait mentir");
      }
    }
    // V2.1 — le générateur affine ensuite par SONDE DE CAPACITÉ : il génère la semaine pic,
    // mesure ce que les plafonds de séance permettent réellement, et abaisse la promesse si
    // besoin (« le moteur se vérifie et se corrige » appliqué à ses propres promesses —
    // corrige notamment la nage non-débutante que V1.5 déclare à 6.3h pour 3.6h livrables).

    const thrPace = a.pace_known === "oui" ? parsePaceSec(a.pace) : 0;
    const css = a.css_known === "oui" ? parsePaceSec(a.css) : 0;
    const ftp = a.ftp_known === "oui" ? parseInt(a.ftp || "") || 0 : 0;
    const hz = hrZones(a.age, a.hr_max, a.hr_rest);

    return {
      profile: a,
      decisions,
      weeks,
      phases,
      volPeak,
      volBase: Math.round(volPeak * 0.58 * 10) / 10,
      peakH,
      sessionScale,
      use10,
      recupEvery,
      offDays,
      budgetPerWeek,
      maxRunDays,
      medHold,
      beginner,
      finisher,
      comp,
      dbl: a.doubles === "oui",
      injuries,
      baseRefs: { ftp, thrPace, css },
      hz,
    };
  }
}

/**

/** R3.1/R3.8 — intensités relatives : référence + multiplicateurs, replis FC puis RPE. */
const ZDEF                          = {

  "bk.ss": { ref: "ftp", lo: 0.88, hi: 0.94, hr: "tempo", fb: "effort 7/10 soutenu" },
  "bk.vo2": { ref: "ftp", lo: 1.06, hi: 1.18, hr: null, fb: "effort 9/10 (RPE — la FC suit mal sur 4min)" },
  "bk.frc": { ref: "ftp", lo: 0.78, hi: 0.86, hr: null, fb: "gros braquet, effort musculaire (cadence>FC)" },
  "bk.rp": { ref: "ftp", lo: 0.8, hi: 0.88, hr: "tempo", fb: "allure course soutenue" },
  "bk.thr": { ref: "ftp", lo: 0.95, hi: 1.05, hr: "seuil", fb: "seuil ~1h" },
  "rn.easy": { ref: "thrPace", lo: 1.16, hi: 1.26, hr: "z2", fb: "allure conversation" },
  "rn.mara": { ref: "thrPace", lo: 1.08, hi: 1.13, hr: "tempo", fb: "allure marathon" },
  "rn.thr": { ref: "thrPace", lo: 1.0, hi: 1.05, hr: "seuil", fb: "allure seuil ~1h" },
  "rn.vo2": { ref: "thrPace", lo: 0.92, hi: 0.97, hr: null, fb: "allure 5-10min (RPE — FC peu fiable sur l'intervalle court)" },
  "rn.rec": { ref: "thrPace", lo: 1.28, hi: 1.4, hr: "z1", fb: "récup très lent" },
  "sw.easy": { ref: "css", lo: 1.12, hi: 1.12, hr: null, fb: "souple, technique" },
  "sw.aero": { ref: "css", lo: 1.06, hi: 1.06, hr: null, fb: "endurance régulière" },
  "sw.css": { ref: "css", lo: 1.0, hi: 1.0, hr: null, fb: "allure seuil (test 400m)" },
  "sw.speed": { ref: "css", lo: 0.94, hi: 0.94, hr: null, fb: "rapide mais contrôlé" },
};

const fk = (s        ) => Math.floor(s / 60) + "'" + String(Math.round(s % 60)).padStart(2, "0");

function fmtInt(key                           , refs      , hz         )         {
  const d = key ? ZDEF[key] : undefined;
  if (!d) return key || "";
  if (d.ref === "ftp" && refs.ftp) return Math.round(refs.ftp * d.lo) + "-" + Math.round(refs.ftp * d.hi) + "W";
  if (d.ref === "thrPace" && refs.thrPace) return fk(refs.thrPace * d.lo) + "-" + fk(refs.thrPace * d.hi) + "/km";
  if (d.ref === "css" && refs.css) return (d.lo === d.hi ? fk(refs.css * d.lo) : fk(refs.css * d.lo) + "-" + fk(refs.css * d.hi)) + "/100m";
  if (d.hr && hz[d.hr]) return hz[d.hr];
  return d.fb;
}

const intOf = (key               )                                                 => {
  const d = key ? ZDEF[key] : undefined;
  return d ? { ref: d.ref, lo: d.lo, hi: d.hi } : null;
};

/** Minutes d'un step (nage : mètres via CSS de base ; km course/vélo via allure seuil). */
function stepMin(st        , disc        , baseRefs      )         {
  const reps = st.reps || 1;
  if (st.durationMin) return reps * st.durationMin;
  if (st.distanceM) {
    const d = st.d || disc;
    if (d === "sw") return ((reps * st.distanceM) / 100) * ((baseRefs.css || 130) / 60);
    return ((reps * st.distanceM) / 1000) * ((baseRefs.thrPace || 330) / 60);
  }
  return 0;
}

                                               
                      
                   
                   
 

function renderSess(s                   , refs      , hz         , baseRefs      )         {
  const steps = s.steps || [];
  const bodies = steps.filter((x) => x.role === "body");
  let bodyMin = 0;
  for (const b of bodies) {
    b._min = stepMin(b, s.d, baseRefs);
    bodyMin += b._min;
  }
  const seg           = [];
  if (s.brick) {
    const bk = bodies.find((b) => b.leg === "bike") ;
    const rn = bodies.find((b) => b.leg === "run") ;
    seg.push(
      bk.durationMin + "min vélo @ " + fmtInt(bk.zone          , refs, hz) +
        ", dernier tiers @ allure course, échauffement progressif inclus, puis transition rapide + " + rn.durationMin + "min CAP" +
        (s.runInj ? " souple, surface souple" : " @ allure cible")
    );
  } else {
    const w = steps.find((x) => x.role === "warmup");
    if (w) {
      if (w.durationMin != null) {
        const wm = Math.min(w.durationMin, C13_WARMUP_MAX_MIN, Math.max(3, Math.round(bodyMin) || w.durationMin));
        w._min = wm;
        seg.push("Échauffement " + wm + "min" + (w.text ? " " + w.text : ""));
      } else if (w.distanceM != null) {
        w._min = stepMin(w, s.d, baseRefs);
        seg.push("Échauffement " + w.distanceM + "m" + (w.text ? " " + w.text : ""));
      }
    }
    for (const b of bodies) {
      let str = (b                       ).prefix || "";
      const reps = b.reps || 1;
      if (reps > 1) str += reps + "×";
      if (b.durationMin != null) str += b.durationMin + "min";
      else if (b.distanceM != null) str += ((b                        ).unitKm ? b.distanceM / 1000 : b.distanceM) + ((b                        ).unitKm ? "km" : "m");
      if (b.zone) str += " @ " + fmtInt(b.zone          , refs, hz);
      str += (b                       ).suffix || "";
      if (b.recoveryText) str += " (récup " + b.recoveryText + " entre les blocs)";
      seg.push(str);
    }
    const c = steps.find((x) => x.role === "cooldown");
    if (c) {
      if (c.durationMin != null) {
        c._min = c.durationMin;
        seg.push("Retour au calme " + c.durationMin + "min" + (c.text ? " " + c.text : ""));
      } else if (c.distanceM != null) {
        c._min = stepMin(c, s.d, baseRefs);
        seg.push("Retour au calme " + c.distanceM + "m" + (c.text ? " " + c.text : ""));
      }
    }
  }
  let det = seg.join(" · ");
  if (s.note) det += " — 💡 " + s.note;
  s.min = steps.reduce((t, x) => t + (x._min || 0), 0);
  s.det = det;
  return det;
}
