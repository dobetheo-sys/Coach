const QLABELS={intent:"Intention",format:"Objectif",terrain:"Terrain",epreuve:"Épreuve",milieu:"Milieu",sex:"Sexe",level:"Niveau",swim_limit:"Limite",
  ftp_known:"FTP connue",ftp:"FTP",pace_known:"Allure connue",pace:"Allure seuil",css_known:"CSS connu",css:"CSS",history:"Historique",injury:"Blessures",
  sessions_max:"Séances max",vol_max:"Volume max",dispo:"Dispo",shift_ok:"Décalage",off_days:"Jours OFF",off_which:"Jours bloqués",doubles:"Doubles",
  sleep:"Sommeil",life_load:"Charge vie",hrv:"HRV",daily_burn:"Activité",weight_lever:"Levier poids",cycle_sync:"Cycle menstruel",races:"Courses inter.",age:"Âge",weight:"Poids",height:"Taille"};
function ruleTrigger(id){return {intent:"intent",sante:"intent",duree:"format",medical:"med_treat",terrain:"terrain",clm:"format",ow:"milieu",bassin:"milieu",
  tech:"level",recup:"history",inj:"injury",volume:"vol_max",sessions:"sessions_max",cycle:"shift_ok",polar:"doubles",
  sleep:"sleep",life:"life_load",hrv:"hrv",renfo:"hrv",gammes:"hrv",force:"hrv",tech_drill:"hrv",poids:"weight_lever",fer:"sex",cyclep:"cycle_sync",races:"races"}[id];}

function bindInputs(scope){
  scope.querySelectorAll(".opts").forEach(g=>{const key=g.dataset.key,multi=g.dataset.multi==="1",excl=g.dataset.exclusive||"";
    g.querySelectorAll(".opt").forEach(b=>{const cur=(S.answers[key]||"").split(",").filter(Boolean);
      if(multi?cur.includes(b.dataset.val):S.answers[key]===b.dataset.val)b.classList.add("sel");
      b.onclick=()=>{
        if(multi){let v=(S.answers[key]||"").split(",").filter(Boolean);const x=b.dataset.val;
          if(x===excl)v=[x];else{v=v.filter(z=>z!==excl);v.includes(x)?v=v.filter(z=>z!==x):v.push(x);}
          S.answers[key]=v.join(",");g.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",v.includes(o.dataset.val)));
        } else {g.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));b.classList.add("sel");S.answers[key]=b.dataset.val;if(key==="intent")document.body.dataset.intent=b.dataset.val;}
        const st=curSteps()[S.step];if(st&&st.branches)st.branches(S.answers);refreshTrail();refreshNav();
      };});});
  scope.querySelectorAll("[data-input]").forEach(inp=>{const key=inp.dataset.input;if(S.answers[key])inp.value=S.answers[key];inp.oninput=()=>{S.answers[key]=inp.value;refreshNav();};});
}
function refreshTrail(){ /* fil de décision retiré — remplacé par le bandeau visuel du plan */ }
function refreshNav(){const st=curSteps()[S.step],b=$("nextBtn");if(b&&st)b.disabled=!st.valid(S.answers);}

function renderSportPick(){
  $("progress").innerHTML="";
  let html='<div class="card welcome"><div class="w-tri">🏁</div><h2>Quel plan veux-tu construire ?</h2>'
    +'<p>Un moteur de raisonnement par sport — choisis le tien, le questionnaire s\'adapte.</p><div class="sport-grid">';
  Object.entries(SPORTS).forEach(([k,c])=>{html+='<button class="sport-card" data-sport="'+k+'" type="button" style="--sa:'+c.accent+'"><span class="sc-ico">'+c.ico+'</span><span class="sc-nom">'+c.nom+'</span><span class="sc-pitch">'+c.pitch+'</span></button>';});
  html+='</div></div>';
  $("screen").innerHTML=html;
  document.querySelectorAll(".sport-card").forEach(b=>b.onclick=()=>{S.sport=b.dataset.sport;document.body.dataset.sport=b.dataset.sport;S.started=true;S.step=0;renderStep();});
}
function renderStep(){
  if(!S.sport){renderSportPick();return;}
  const steps=curSteps(),fT=buildFreeSteps().length+1,pT=buildPremiumSteps().length+1;
  let p="";
  if(S.tier==="free")p=Array.from({length:fT},(_,i)=>'<div class="pstep '+(i<S.step?"done":i===S.step?"cur":"")+'"></div>').join("")+'<div class="psep">★</div>'+Array.from({length:pT},()=>'<div class="pstep prem"></div>').join("");
  else p=Array.from({length:fT},()=>'<div class="pstep done"></div>').join("")+'<div class="psep">★</div>'+Array.from({length:pT},(_,i)=>'<div class="pstep prem '+(i<S.step?"done":i===S.step?"cur":"")+'"></div>').join("");
  $("progress").innerHTML=p;
  if($("tierBadge")){$("tierBadge").className="tier-badge "+(S.tier==="free"?"free":"premium");$("tierBadge").textContent=(S.tier==="free"?"● ":"★ ")+SPORTS[S.sport].nom+(S.tier==="free"?" · gratuit":" · premium");}
  if(S.step>=steps.length){renderBlueprint();return;}
  const st=steps[S.step];
  $("screen").innerHTML='<div class="card"><div class="eyebrow">'+st.eyebrow+'</div><h2>'+st.title+'</h2><div class="why">'+st.why+'</div>'+st.render()
    +'<div class="nav"><button class="btn" id="prevBtn" type="button" '+(S.step===0&&S.tier==="free"?'style="visibility:hidden"':'')+'>← Retour</button><button class="btn primary" id="nextBtn" type="button">Continuer →</button></div></div>';
  bindInputs($("screen"));if(st.branches)st.branches(S.answers);
  $("prevBtn").onclick=()=>{if(S.step===0&&S.tier==="premium"){S.tier="free";S.step=buildFreeSteps().length;}else if(S.step===0){S.sport=null;S.started=false;document.body.dataset.sport="";}else S.step--;renderStep();};
  $("nextBtn").onclick=()=>{S.step++;renderStep();};
  refreshNav();refreshTrail();
}
const RULE_CAT={intent:"struct",sante:"sante",duree:"struct",medical:"sante",terrain:"struct",clm:"struct",ow:"disc",bassin:"disc",tech:"disc",recup:"struct",inj:"sante",volume:"struct",sessions:"struct",cycle:"struct",polar:"struct",sleep:"sante",life:"sante",hrv:"sante",renfo:"sante",gammes:"disc",force:"disc",tech_drill:"disc",poids:"nutri",fer:"sante",cyclep:"sante",races:"struct"};
const CATS=[["struct","🧱","Structure"],["sante","❤️","Santé & garde-fous"],["disc","🎯","Spécifique sport"],["nutri","🍽","Nutrition"]];
const HEROS=["cycle","volume","intent","sante"];
function rulesGrouped(rules){let h="";const hs=HEROS.map(id=>rules.find(r=>r.id===id)).filter(Boolean);
  if(hs.length){h+='<div class="bp-heros">';hs.forEach(r=>h+='<div class="bp-hero"><div class="bh-cat">'+r.what+'</div><div class="bh-val">'+r.val+'</div></div>');h+='</div>';}
  CATS.forEach(([c,ic,l])=>{const inc=rules.filter(r=>(RULE_CAT[r.id]||"struct")===c&&!HEROS.includes(r.id)),hic=rules.filter(r=>(RULE_CAT[r.id]||"struct")===c&&HEROS.includes(r.id));if(!inc.length&&!hic.length)return;
    h+='<div class="bp-cat"><div class="bp-cat-h"><span class="ic">'+ic+'</span>'+l+'</div>';hic.concat(inc).forEach(r=>h+='<div class="bp-decision"><div><div class="bp-what">'+r.what+'</div><div class="bp-val">'+r.val+'</div></div><div class="bp-why">'+r.why+'</div></div>');h+='</div>';});
  return h;}
function renderBlueprint(){
  // Plus de mur de règles : transition visuelle directe vers le plan.
  const a=S.answers,med=a.med_pain==="oui"||a.med_dizzy==="oui"||a.med_treat==="oui";
  let html='<div class="card">';
  if(med)html+='<div class="warn"><strong>⚠️ Signal médical déclaré.</strong> Consulte un médecin avant de démarrer toute intensité.</div>';
  if(S.tier==="free"){
    html+='<div class="eyebrow">'+SPORTS[S.sport].nom+' — prêt</div><h2>Ton plan est prêt 🎯</h2>'
      +'<div class="why">On a tout ce qu\'il faut. Génère ton calendrier, ou affine encore avec quelques questions premium.</div>'
      +'<div class="gate"><h3>⚡ Voir mon plan</h3><button class="btn gold" id="genBtn" type="button">Générer mon calendrier</button></div>'
      +'<div class="gate" style="background:var(--bg2)"><h3>★ Aller plus loin</h3><p>Sommeil, nutrition, courses intermédiaires : 4 questions pour calibrer plus finement.</p><button class="btn" id="goPremium" type="button">Affiner en premium →</button></div>'
      +'<div class="nav"><button class="btn" id="prevBtn" type="button">← Modifier</button><button class="btn" id="restartBtn" type="button">Changer de sport</button></div></div>';
    $("screen").innerHTML=html;$("genBtn").onclick=()=>renderPlan();$("goPremium").onclick=()=>{S.tier="premium";S.step=0;renderStep();};
    $("prevBtn").onclick=()=>{S.step--;renderStep();};$("restartBtn").onclick=()=>reset();
  } else {
    // premium : on va DIRECT au plan, pas d'écran intermédiaire
    renderPlan();return;
  }
}
function reset(){S.sport=null;S.answers={};S.step=0;S.tier="free";S.started=false;S.showAllWeeks=false;document.body.dataset.intent="";document.body.dataset.sport="";renderStep();}
function driverBand(a){
  const sp=S.sport, chips=[];
  const C=(ic,txt,col)=>chips.push('<span class="drv" style="--dc:'+col+'"><b>'+ic+'</b>'+txt+'</span>');
  // intention
  if(a.intent==="competition")C("🎯","Performance","#e63946");
  else if(a.intent==="finir")C("🏁","Finir","#ff7a1a");
  else if(a.intent==="plaisir")C("☀️","Plaisir","#2e6bff");
  // structure cycle
  const nOff=(a.off_which||"").split(",").filter(Boolean).length;
  if(a.dispo==="quotidienne"&&a.shift_ok==="oui"&&nOff<2)C("🔄","Cycles 10j","#9b72ff");
  else C("📅","Semaine 7j","#9b72ff");
  // données / zones
  if(sp==="bike"||sp==="tri"){ if(a.ftp_known==="oui")C("⚡","FTP "+a.ftp+"W","#f0b429"); else C("❤️","Zones FC","#f0b429"); }
  if(sp==="run"||sp==="tri"){ if(a.pace_known==="oui")C("⏱","Seuil "+a.pace,"#00a376"); else C("❤️","Zones FC","#00a376"); }
  if(sp==="swim"){ if(a.css_known==="oui")C("⏱","CSS "+a.css,"#00b8d9"); else C("🌊","Technique","#00b8d9"); }
  // blessure
  const inj=(a.injury||"").split(",").filter(x=>x&&x!=="aucune");
  if(inj.length)C("🩹",inj.length>1?"Prudence blessures":"Adapté blessure","#e63946");
  // santé / garde-fou
  if(a.hrv==="oui")C("📈","Garde-fou HRV","#00a376");
  if(a.history==="reprise")C("🌱","Reprise — progressif","#00b8d9");
  // renfo (toujours)
  if(sp==="run")C("💪","Renfo + plio graduée","#9b72ff");
  else if(sp==="swim")C("💪","Renfo épaules","#9b72ff");
  else C("💪","Renfo intégré","#9b72ff");
  return '<div class="drv-band"><div class="drv-title">Ce qui pilote ton plan</div><div class="drv-wrap">'+chips.join("")+'</div></div>';
}
function renderPlan(){
  const a=S.answers,plan=buildPlan(a),ic={sw:"🏊",bk:"🚴",rn:"🏃",br:"🔁",rs:"💪"};
  let html='<div class="card"><div class="eyebrow">Génération — '+SPORTS[S.sport].nom+'</div><h2>Ton calendrier prend forme</h2>'
    +'<div class="why">'+plan.totalWeeks+' semaines en '+(plan.use10?"cycles de 10 jours (qui glissent)":"semaines de 7 jours")+', volume '+plan.volBase+'h → '+plan.volPeak+'h.</div>';
  html+=driverBand(a);
  html+='<div class="ph-line">';plan.phases.forEach(p=>html+='<div class="ph-seg" style="flex:'+p.weeks+';background:'+p.c+'22;border-color:'+p.c+'"><span>'+p.nom+'</span><em>'+p.weeks+'sem</em></div>');html+='</div>';
  html+='<div class="vol-bars">';plan.weeks.forEach(w=>{const h=Math.max(8,Math.round(w.vol/plan.volPeak*52));html+='<div class="vb" style="height:'+h+'px;background:'+(w.isRecup?"#9b72ff":w.phase.c)+'" title="S'+w.num+' '+w.vol+'h"></div>';});html+='</div><div class="vol-cap">1 barre = 1 semaine · violet = récup</div>';
  const show=S.showAllWeeks?plan.weeks:[...plan.weeks.slice(0,3),plan.weeks[plan.weeks.length-1]];
  show.forEach((w,ix)=>{if(!S.showAllWeeks&&ix===3)html+='<div class="wk-skip">⋯ semaines 4 à '+(plan.totalWeeks-1)+' ⋯</div>';
    const raceTag=w.race?' <span style="background:#ff3b30;color:#fff;border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700">🏁 COURSE '+w.race+'</span>':(w.postRace?' <span style="color:#9b72ff;font-size:10px">↳ récup post-course</span>':"");
    html+='<div class="gw"><div class="gw-h"><b>Semaine '+w.num+'</b><span style="color:'+w.phase.c+'">'+w.phase.nom+'</span>'+raceTag+'<em>'+w.vol+'h'+(w.isRecup?" récup":"")+'</em></div><div class="gw-grid">';
    w.days.forEach(d=>{const bg=d.sessions.map(s=>'<span>'+ic[s.d]+'</span>').join("");const nm=d.sessions.map(s=>'<b>'+s.name+'</b>'+(s.det?'<span class="gd-det">'+s.det+'</span>':"")).join("");
      html+='<div class="gd '+d.charge+'"><div class="gd-top"><b>'+d.jour+'</b>'+(plan.use10?'<i>C'+d.cyc+'J'+d.jc+'</i>':"")+'</div><div class="gd-badges">'+bg+'</div><div class="gd-n">'+nm+'</div></div>';});
    html+='</div></div>';});
  html+='<div class="warn" style="background:var(--bg2)">Intensités calibrées sur tes données. Version complète : nutrition quotidienne, courses placées, checkpoints.</div>'
    +'<div class="nav" style="flex-wrap:wrap;gap:10px"><button class="btn" id="backBp" type="button">← Modifier</button><button class="btn gold" id="allW" type="button">'+(S.showAllWeeks?"Réduire":"Voir les "+plan.totalWeeks+" semaines")+'</button><button class="btn primary" id="prn" type="button">🖨 Exporter</button><button class="btn" id="restartBtn" type="button">Changer de sport</button></div></div>';
  $("screen").innerHTML=html;$("backBp").onclick=()=>{S.step=curSteps().length-1;renderStep();};$("allW").onclick=()=>{S.showAllWeeks=!S.showAllWeeks;renderPlan();window.scrollTo(0,0);};$("prn").onclick=()=>downloadPlan();$("restartBtn").onclick=()=>reset();
  refreshTrail();
}
function downloadPlan(){
  const a=S.answers, plan=buildPlan(a), cfg=SPORTS[S.sport];
  const ic={sw:"🏊",bk:"🚴",rn:"🏃",br:"🔁",rs:"💪"};
  let rows="";
  plan.weeks.forEach(w=>{
    const rt=w.race?" · 🏁 COURSE "+w.race:(w.postRace?" · récup post-course":"");
    rows+='<div class="w"><div class="wh"><b>Semaine '+w.num+'</b> · '+w.phase.nom+rt+' · '+w.vol+'h'+(w.isRecup?" (récup)":"")+'</div><div class="g">';
    w.days.forEach(d=>{
      const s=d.sessions.map(x=>ic[x.d]+" <b>"+x.name+"</b>"+(x.det?" — "+x.det:"")).join("<br>");
      rows+='<div class="d '+d.charge+'"><div class="dh">'+d.jour+(plan.use10?" · C"+d.cyc+"J"+d.jc:"")+'</div>'+s+'</div>';
    });
    rows+='</div></div>';
  });
  const rules=evalRules(a,S.tier);
  const blue=rules.map(r=>'<li><b>'+r.what+' :</b> '+r.val+'<br><span style="color:#555">'+r.why+'</span></li>').join("");
  const doc='<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon plan '+cfg.nom+'</title>'
    +'<style>body{font-family:-apple-system,Arial,sans-serif;max-width:900px;margin:0 auto;padding:24px;color:#16130e;background:#f1eadb}'
    +'h1{font-size:24px}h2{font-size:16px;margin-top:24px;border-bottom:2px solid #16130e;padding-bottom:4px}'
    +'.w{margin:14px 0;page-break-inside:avoid}.wh{font-size:14px;margin-bottom:6px}'
    +'.g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}@media(max-width:680px){.g{grid-template-columns:repeat(2,1fr)}}'
    +'.d{border:1.5px solid #16130e;border-radius:6px;padding:6px;font-size:10px;min-height:70px}'
    +'.d.dur{background:#ffe3e0}.d.facile{background:#d9f3e1}.d.recup{background:#e9defc}.d.off{background:#eee}'
    +'.dh{font-weight:700;font-size:9px;margin-bottom:3px}ul{font-size:12px;line-height:1.5}'
    +'@media print{body{background:#fff}}</style></head><body>'
    +'<h1>'+cfg.ico+' Mon plan '+cfg.nom+'</h1>'
    +'<p>'+plan.totalWeeks+' semaines · '+(plan.use10?"cycles de 10 jours":"semaines de 7 jours")+' · volume '+plan.volBase+'h → '+plan.volPeak+'h · objectif '+(a.format||"")+'</p>'
    +'<h2>Les décisions de ton plan</h2><ul>'+blue+'</ul>'
    +'<h2>Calendrier complet</h2>'+rows
    +'<p style="margin-top:30px;font-size:11px;color:#777">Généré par EnduraBuild · à valider avec un professionnel de santé. Astuce : ouvre ce fichier et fais Imprimer → Enregistrer en PDF.</p>'
    +'</body></html>';
  const blob=new Blob([doc],{type:"text/html"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url; link.download="plan-"+S.sport+"-"+(a.format||"")+".html";
  document.body.appendChild(link); link.click();
  setTimeout(()=>{document.body.removeChild(link);URL.revokeObjectURL(url);},200);
}

renderStep();

</script>
